decision_summary: >
  The smallest reusable physical boundary whose correctness conditions cannot be separated is the
  **RF-to-RF balanced repetition**, and the answer is layered- that kernel, with steady-state
  establishment and
  k-space ordering as composition above it.

  The boundary follows from one test applied to four hypotheses- can this thing state a correctness
  condition it can also check?  The RF-to-RF repetition can -- zero net area per axis over its own
  interval, echo at its declared TE -- stating it from its own configuration, with nothing needed
  from a caller.  **Superseded 2026-10-05:** this previously added "and can check it on a single
  instance with no reference to its neighbours", which the interval does not support.  The interval
  ends inside the successor, so the *measurement* is on an adjacent pair; see
  `boundary_hypotheses.compared[A].correctness_condition` for the compositional form that replaced
  it.  A steady-state segment abstraction cannot- its claim is that the magnetisation
  has converged, which no waveform measurement reaches.  A balanced-requirement abstraction cannot
  be expressed at all.  So the kernel is the repetition, and everything the segment would have
  owned is policy that every witness and the domain source already place outside it.

  Domain evidence decided three things the code corpus obscured.  **TE = TR/2 is not an
  invariant** -- it is the condition for T2 rather than T2-star weighting, and partial-echo bSSFP
  at TE < TR/2 is a named realisation.  Two of three witnesses hard-wire TR/2 and would have
  taught us the wrong contract.  **Both catalyzing methods the witnesses use are canonical**, so
  their
  disagreement is two named alternatives rather than evidence about the boundary.  And **"balanced"
  is a strictly stronger condition than "SSFP"** -- area zero per repetition, not merely area
  constant across repetitions -- which no implementation states because each implements only one
  of the two.

  One quantified cost, and it is the architecture-revisit finding.  A module's events cannot
  continue into the next instance of itself, so a per-repetition boundary must fall where every
  axis is at zero.  On the readout axis that turns one 540 us lobe into two of 380 us -- **220 us
  per repetition per axis, about 5.5 % of a 4 ms TR** -- and the slice axis carries the same split.
  `writeTrufi` reshuffles exactly this away, and can only do so because it is a script rather than
  a composable unit.  SeqCraft's compiler already keeps a waveform continuous across RF and ADC
  seams INSIDE one module, measured at constant amplitude across both; what it cannot do is carry
  one across the repetition boundary.

  **Superseded 2026-10-05.**  That cost was the open decision before implementation; it is settled.
  Measured on the built module, the composable split costs 270-290 us per repetition, 3.8-4.7 % of
  TR across four protocols, against the lumped realisation.  The split was chosen because it does
  not assume the successor's selection-gradient geometry -- it balances against a neighbour with a
  different slice thickness, pulse duration or readout bandwidth, and the lumped form would not.
  The lumped form stays available at a known price.  No compiler change was made.  The observation
  that bSSFP and velocity encoding arrive at the same missing capability from opposite directions
  stands as a finding of this scan, and is not a reason to revisit the choice.

open_questions:
  - >
    **ANSWERED 2026-10-05.**  Accept the per-repetition boundary cost, or wait for a way to express
    a balanced requirement across it?  Accepted, at a measured 270-290 us per repetition and
    3.8-4.7 % of TR.  What the cost buys is that no repetition is built against an assumption about
    its successor's selection gradient.  Nothing blocks implementation, and `bSSFP2DTR` is built.
    A protocol that cannot afford 4 % of TR is the evidence that would reopen it.
  - >
    **ANSWERED 2026-10-05.**  Should the kernel expose TE independently (R3) or derive TE = TR/2
    (R1, R2)?  Exposed, with `TR/2` as the default: `te_s=None` resolves to the shortest legal
    *symmetric* repetition, which is deliberately unlike `GRE2DTR`, where `None` means the earliest
    reachable echo.  `min_tr_s` reports the minimum of the symmetric realisation and `min_te_s` the
    earlier asymmetric floor.  One wrinkle the implementation found: for a given readout geometry
    the exact midpoint need not lie on the available timing lattice, so the default takes the
    nearest symmetric realisation and `symmetry_residual_s` reports the signed amount achieved
    rather than the declared TE being rounded to `TR/2`.
  - >
    Does GRE2DTR share anything with this kernel?  Both are "one repetition- excite, encode, read,
    rewind".  They differ in the balance condition and the phase progression -- spoiled GRE is RF
    spoiled, bSSFP is sign alternated -- and D1's Table 14.2 factorises exactly along those two
    axes.  **Not investigated, and deliberately not refactored.**  Recorded because the
    factorisation suggests a shared repetition skeleton, which is an architecture question worth
    its own pass rather than a side effect of this one.

evidence_state:
  human_review: DONE       # the boundary-cost trade was reviewed and settled 2026-10-05
  experiment_design_review: DONE
  scanner_validation: NOT_REQUIRED_FOR_CLAIM
  note: >
    Not required- every acceptance item is a waveform or timing measurement, and the steady-state
    claim the kernel explicitly does not make is what a scanner would be needed for.
  deferred:
    - what: The steady-state claim itself.
      why: >
        It is a train-level property, not a repetition property, and the kernel is scoped to
        exclude it.  D1- four to five times T1 to converge.
      revisit_trigger: >
        Layer 3 runs, or a caller wants the library to assert that a train has converged.
    - what: Start-up preparation as a shipped abstraction.
      why: >
        D1 names at least three catalyzing methods -- alpha/2 with TR/2, a linear flip-angle ramp,
        and ramp-down storage on the longitudinal axis -- and gives no criterion for choosing.  An
        abstraction with no correctness condition of its own is policy.  GRE2DTR sets the
        precedent- its dummy repetitions live in the example's loop.
      revisit_trigger: >
        Two schemes turn out to share a correctness condition a caller keeps getting wrong.
    - what: >
        Implementation of the kernel itself.  **Deferred by review 2026-09-22; `bSSFP2DTR`
        implemented 2026-10-05.  `bSSFP3DTR` is a separate change.**
      why: >
        The boundary finding was accepted -- RF-to-RF is the kernel, steady-state establishment
        sits above it, and segmentation and ordering are acquisition policy.  What was NOT
        decided was whether to pay the measured 220 us per axis per repetition that forcing
        gradients to terminate at a module boundary costs.

        **Settled 2026-10-05 on the built module.**  The cheaper waveform is the *lumped* z
        realisation: one trailing lobe of -(A_post + A_pre) and no leading winder, which is what
        merging a repetition's trailing lobe with its successor's leading winder produces.
        Against it the composable split costs 270-290 us per repetition, 3.8-4.7% of TR across
        four protocols, and the cost is structural: the leading winder has to play before its own
        RF centre and nothing else in the repetition may, because the readout prephaser and the
        phase-encode blip act on magnetisation that does not exist until then.

        The split was chosen, on that measurement and nothing broader.  It does not assume the
        successor's selection-gradient geometry, and balances against a neighbour with a
        different slice thickness, pulse duration or readout bandwidth -- below 1e-12 1/m on
        compiled trains -- while the lumped form is built against an assumed successor and would
        not.  Start-up ramps, segmentation and same-thickness multi-slice are NOT evidence for
        this choice and are not offered as such: they change RF amplitude, acquisition policy
        and RF frequency offset respectively, none of which touches the selection gradient, and
        all three would work under the lumped form too.  The lumped form stays available at a
        known price; a protocol that cannot afford 4% of TR is the evidence that would justify
        it.  No compiler change was made, and the compiler learned nothing about bSSFP.

        One thing the timing measurement separated out: balance composability is not timing
        composability.  A neighbour differing in thickness or RF duration still balances but
        moves the RF-centre offset, so stacking by block duration misses the declared TR by 120
        and 500 us respectively.  `time_to_rf_center()` exists so that a composition can place
        from the offsets instead; the kernel does not do the placement.
      revisit_trigger: >
        A protocol arrives that cannot afford the measured 4% of TR.  The lumped realisation is
        then the small local change, and the price of taking it is in `why` above.
    - what: >
        Whatever removes the per-repetition boundary cost.  **ANSWERED 2026-10-05: it is (b).**
      why: >
        Two readings led to different layers.
        (a) If the rewinder of repetition n and the prephaser of n+1 could be fused with NO change
        of physical semantics -- same emitted G(t), same RF and ADC timing, only a different
        pulseq representation and block partition -- then this would be a candidate for a
        semantics-preserving optimisation in the COMPILER, and no bSSFP physics need go near it.
        (b) If the efficient form requires choosing the waveform with the balance target in view,
        it is physics-aware joint design and belongs to a joint owner in the MODULE layer.

        **It is (b).**  A minimal reproducer settled it before the module was written: two abutting
        same-polarity trapezoids compile to a waveform that ramps to zero between them, and
        replacing the pair with one lobe of twice the area preserves M0 to 2e-13 but changes M1 by
        16% and the duration by 270 us.  Emitted `G(t)` changes, so it is physical redesign and not
        representation optimisation.  The criterion used is deliberately NOT "preserves every
        declared requirement", because that would license the compiler to reason that an undeclared
        M1 is free to change -- an MRI-physics judgement the compiler does not make.

        So the cheaper form lives in the Module layer, where it is the lumped z realisation
        described in the entry above, and it was not taken.  No compiler change was made.
      revisit_trigger: >
        **Do not recover the cost by teaching the compiler about bSSFP** -- that would be (b)
        implemented as (a).  A general representation-only optimisation, one that leaves emitted
        `G(t)` and RF/ADC timing untouched, is a separate proposal with its own evidence.
    - what: Banding, CISS and multi-acquisition phase cycling.
      why: >
        D1 places them above the repetition- two acquisitions separately reconstructed and
        combined.  Acquisition and reconstruction policy.
      revisit_trigger: A candidate is scanned whose subject is phase-cycle combination.
    - what: Whether GRE2DTR and the bSSFP kernels share a repetition skeleton.
      why: >
        Table 14.2 factorises gradient-echo sequences into waveform class x RF train class, which
        suggests they do.  Refactoring a shipped kernel on the strength of a table is not
        warranted.
      revisit_trigger: >
        A third repetition kernel is proposed, making the shared part a real abstraction with
        three consumers rather than a hypothesis with two.

skill_observation:
  do_not_change_v0_yet: true
  domain_reference_changed_the_outcome: true
  how: >
    Second consecutive case, and more sharply than in C1.  Here the code witnesses were PLENTIFUL
    -- three independent implementations, the best evidence base in the project -- and they still
    would have taught the wrong contract.  Two of three hard-wire TE = TR/2, so a boundary derived
    from code alone would have made it an invariant; D1 says it is a contrast condition with a
    named realisation on the other side of it.  And no implementation states the SSFP-versus-
    balanced distinction, because each implements one of the two.
    **So the value of domain evidence is not a fallback for thin corpora.**  In C1 it established a
    family that one witness could not; here it corrected a contract that three witnesses agreed on.
    Those are different jobs, and only the second one was a surprise.
  what_v0_lacks: >
    The same missing `evidence_class`, recorded by hand again.  Additionally- v0's outcome
    vocabulary has no light for "the boundary is settled and a quantified cost needs a product
    decision".  APPROVED_FOR_IMPLEMENTATION is right about the design and silent about the
    trade-off; YELLOW - PHYSICAL_BOUNDARY_UNCLEAR would be false, because the boundary is clear.
    The record carries the trade in `open_questions` and `decision_summary` where a reader will
    find it, which is adequate and not expressible in the light.
  phase_e_question: >
    Whether `evidence_class: domain-reference` earns formal support is now two for two.  Hold
    until C3, as instructed.
