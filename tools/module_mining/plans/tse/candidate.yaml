physics:
  invariants:            # full table with tolerances in invariant_table.md
    - equal gradient area either side of every refocusing effective centre (CPMG conjugation)
    - kx = 0 and ky = requested line at the echo sample
    - refocusing centres uniformly spaced within a shot
    - every echo at the midpoint between its two refocusing centres
    - first interval = half the echo spacing, from the excitation's effective centre
    - crusher balance about the RF effective centre, not the plateau midpoint
    - effective TE is set by the echo carrying the centre line
    - z quiet while any ADC is open
  varying_parameters:
    - echoes
    - echo_spacing_s
    - matrix / fov
    - partial_fourier
    - refocus flip and duration
    - crusher cycles on slice and readout axes
  caller_policy:
    - the phase-encode table (segments)
    - ordering: linear / interleaved / centric
    - dummy shot count
    - slice ordering
    - TR

architecture:
  needs_review: false
  note: >
    No taxonomy problem so far.  The open question is ownership between the train and the
    existing leaves (findings.md section 8), not where a new folder goes.

disagreements:            # recorded, not resolved -- see findings.md section 6
  - id: D1
    what: slice rephasing folded into the refocusing crusher (R2/R3) vs a rephaser in Excitation (R1)
  - id: D2
    what: readout-axis crusher fspR = 1.0 (R2/R3) vs 0.0 (R1)
  - id: D3
    what: dummy shot plays phase area 0 (R2/R3) vs segment 0's real lines (R1)
  - id: D4
    what: labels -- none (R2) / autoLabel after the fact (R3) / LIN+SEG during build, no ECO (R1)
  - id: D5
    what: >
      R2/R3's construction is exact only when rf_dead_time == rf_ringdown_time; R1 removes the
      assumption.  R1's own protocol (ringdown 30 us) is a case where R2/R3 would be wrong.
    measured: >
      Confirmed by E1, with one correction: at ringdown 40 us the reference shows a 19.2 1/m
      per-pulse slice-area imbalance and a 30 us echo displacement, but the kz residual is
      CONSTANT (-9.6 1/m) rather than alternating.  At 30 us the reference cannot be built at all.
  - id: D6
    what: >
      The PyPulseq reference has no DC sample -- its 64 samples straddle k = 0 by half a dwell --
      while SeqCraft puts a sample there.  Found by the comparator, not by reading.
  - id: D7
    what: a 2 ms refocusing pulse warns at 116 % of max_b1 (R2) and is refused at 130 % (R1)
  - id: D8
    what: >
      R2's derived crusher window is assumed raster-legal; off-raster settings fail at build time.
      R1 derives the window and rounds it.

validation:
  tooling: tools/module_mining/   # branch feat/module-mining-tse
  reference_executable:
    R1: yes                 # notebook executed, not copied
    R2: yes                 # official script, loaded by path and called
    R3: not_attempted       # needs one MATLAB run; .seq carries rf `use` (format 1.5.0), verified
  levels_run:
    L0: pass                # duration, ADC, RF, excitation and refocusing counts all identical
    L1: n/a                 # SeqCraft-to-SeqCraft only; tests/ already owns it
    L2: pass                # waveform areas on exact knots, used for the balance checks
    L3: pass                # TE agrees to 4.6e-14 s; k at echo to 4e-11 (x) and 1.3e-8 (z) 1/m
    L4: pass                # every TSE invariant holds on both implementations
  parameter_sweep: 8/8 cases pass        # sweep_report.md
  metamorphic: 3/3 pass, 1 cited from CI # M1 is pinned by tests/modules/test_se_notebooks.py
  extraction:
    event_digest_vs_notebook: identical at echoes 1, 8, 16 and 72 (HASTE)
    sweep_vs_notebook: 8/8, numbers identical
    package_suite: 902 passed / 19 skipped (was 857); ruff, doctests, mypy subset, api reference,
      9 notebooks -- all clean
    compiler_changes: none
  experiments:
    E0: done    # the protocol reconciliation itself produced findings
    E1: done    # ringdown; the sharpest result
    E2: done
    E3: done
    E4: outstanding   # one MATLAB run
  comparator_corrections:                # both found by measuring, see comparison_report.md s1
    - the echo is the interpolated kx zero crossing, not the nearest sample
    - the equal-area rule about a refocusing pulse does not apply to the phase axis

priority:
  coverage_unlocked:
    - SE (echoes = 1)
    - FSE / TSE
    - HASTE (configuration, not a class)
    - variable-flip TSE (later)
  confidence: high-on-physics, undecided-on-boundary

open_questions:
  - Is the reusable unit the whole shot, including the excitation?
  - Does the readout skew identity belong in CartesianLine?
  - Does the three-axis crusher-window coupling have a home, given GRE2DTR does the same thing?
  - Should Refocusing own the readout-axis lobe pair it currently declines?
  - Is HASTE fully expressible as configuration, against writeHASTE.m?
