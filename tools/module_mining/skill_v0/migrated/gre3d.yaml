# GRE3DTR, normalized into the Skill v0 artifact shape.
#
# The historical record is plans/gre3d/candidate.yaml and is UNCHANGED.
#
# Provenance convention, on every field the schema requires:
#   [VERBATIM]      copied from the historical candidate.yaml
#   [RECONSTRUCTED] assembled from prose in the gre3d/ evidence set; the source is named
#   [NOT RECORDED]  the pilot did not capture this; stated as absent, never invented
#
#   python tools/module_mining/schema.py tools/module_mining/skill_v0/migrated/gre3d.yaml

id: gre-3d-tr                         # [VERBATIM]
name: GRE3DTR                         # [VERBATIM]

capability:
  summary: >                          # [VERBATIM]
    One repetition of a 3D Cartesian gradient echo: readout, in-plane phase encoding and
    partition encoding sharing one winder window, with either a non-selective or a slab-selective
    excitation.
  family: kernel                      # [VERBATIM]

target:
  layer: kernel                       # [VERBATIM]
  path: src/seqcraft/modules/kernel/gre_3d_tr.py    # [VERBATIM]
  composes:                           # [RECONSTRUCTED] extraction_report.md; the historical
                                      # record listed `composes` implicitly via the solve order
    - Excitation
    - PhaseEncode
    - CartesianLine
    - spoiler
  extended:                           # [VERBATIM]
    - src/seqcraft/modules/rf/excitation.py   # rephaser_area_per_m, build(rephase=...)
  untouched:                          # [VERBATIM]
    - Refocusing, the compiler, LogicBlock, every other module
  not_created:                        # [VERBATIM] target.not_proposed / siblings_not_parents
    - GRE3D (imaging) -- not on this evidence
  siblings_not_parents:               # [VERBATIM]
    - GRE2DTR -- a kernel that contained one would have to reach back inside decisions that
      kernel has already made; nor is a slice-selective 2D acquisition the centre partition of
      a 3D slab

# acceptance_criterion.md section 1
reuse_rationale: >                    # [RECONSTRUCTED] working_hypothesis.z and
  On x and y a 3D repetition is a 2D one.  On z it is not: a slab's rephasing and a partition's
  encoding are two signed moments on one axis in one window, and neither leaf has both facts.
  The kernel is the first layer that does.

evidence:
  - repo: pulseq/pulseq               # [VERBATIM]
    commit: 2fd6ab6
    path: matlab/demoSeq/writeGradientEcho3D.m
    license: MIT
    role: primary                     # [VERBATIM role was "primary, non-selective"; the scope
                                      # half moved to `covers`]
    executable: executed              # [VERBATIM note] "the repository also ships gre3d.seq, so
                                      # it is measurable without MATLAB" -- the .seq is read
                                      # directly and no MATLAB run was needed
    covers: non-selective
    # `independence.note`, split per item
    independence: >                   # [VERBATIM] the historical record's top-level
      Shares a house style and identical encoding arithmetic with the MPRAGE variants; they count
      as one witness for the lattice, not several.
  - repo: imr-framework/pypulseq      # [VERBATIM]
    commit: f2c582b
    path: examples/scripts/write_3Dt1_mprage.py
    license: MIT
    role: supporting
    executable: executed
    covers: non-selective
    independence: >                   # [VERBATIM] same source
      Same house style and encoding arithmetic as R1; one witness with it.
  - repo: pulseq/pulseq               # [VERBATIM]
    commit: 2fd6ab6
    paths: [matlab/demoSeq/writeMPRAGE.m, writeMPRAGE_grappa.m, writeMPRAGE_4ge.m]
    license: MIT
    role: architecture-evidence
    executable: documentary
    covers: non-selective
    # exactly these: "R1 and the MPRAGE variants share a house
    # style and identical encoding arithmetic"
    independence: >                   # [VERBATIM] the historical independence.note names
      Share a house style and identical encoding arithmetic with R1; one witness with it.
  - repo: fmrifrey/lps                # [VERBATIM]
    commit: 552d87a
    path: gre3d/gre3d_write_seq.m
    license: MIT
    role: primary
    executable: documentary           # MATLAB, ships no .seq -- read for physics
    covers: slab-selective
    independence: >                   # [VERBATIM] "fmrifrey/lps is independent of all of them"
      Independent of the Pulseq house style.  The ONLY witness to the slab-selective path, which
      is why that path's acceptance criterion is analytic rather than comparative.
  - repo: OpenMRF/openmrf-core-matlab # [VERBATIM]
    commit: fd03604
    path: include_pulseq_toolbox/src_readouts/GRE/
    license: MIT for original OpenMRF work
    role: architecture-evidence
    executable: documentary
    covers: 2D architecture only
    # R1 and the MPRAGE variants and does not mention OpenMRF;
    # its separate ancestry is asserted in the radial record
    # from the same scan
    independence: >                   # [RECONSTRUCTED] the historical `independence.note` covers
      Developed separately from the Pulseq lines.  Consulted for layering, not for 3D encoding.

contract:                             # [VERBATIM] historical key was `working_hypothesis`
  intrinsic: >                        # [VERBATIM] working_hypothesis.z, condensed
    A_z(p) = A_slab_rephase + A_partition(p), solved as ONE legal z winder.  Both terms are
    SIGNED, so the limiting partition is a result of the coupling and not a property of the
    index -- reversing the slab gradient's polarity moves the limit to the opposite kz edge.
  invariants:                         # [VERBATIM] acceptance_criterion.md section 3 checks
    - the RF effective centre is where the module says, and TE is measured from it
    - the z moment from the RF centre to the echo is A_slab_rephase + A_partition(p)
    - kz at the echo is the requested partition's, and is held through the readout
    - dkz between adjacent partitions is 1/fov_z
    - the non-selective limit is the selective solve at zero slab rephasing
    - gradient amplitude and slew are legal at the edge partitions
    - the minimum TE is not longer than a sequential construction would need
    - the slab rephaser is realised once, never twice
  varying_parameters:
    - slab_thickness_mm (None -> non-selective)
    - matrix and fov on three axes
    - partitions
    - te_s / tr_s, implicit or explicit
  solve_order:                        # [VERBATIM] working_hypothesis.solve_order
    - signed A_partition(p) from PhaseEncode semantics, never from array order
    - A_z(p) = A_slab_rephase + A_partition(p), per partition
    - t_z_min(p) = shortest legal duration for A_z(p) under this scanner's limits
    - z_worst_s = max over ALL supported partitions (enumerated, not shortcut to the edges)
    - shared_winder_s = max(x_prephaser_min, y_encode_worst, z_worst)
  modes:                              # [RECONSTRUCTED] mode_contract.md, which the pilot wrote
                                      # AFTER the RF-default mistake.  Rule A fires here.
    - name: non-selective
      rf_family: block
      rf_duration: 0.2 ms, chosen by this kernel
      selection_gradient: absent
      intrinsic_rephasing: none required
      encoding_role: z carries a partition encode and nothing else
      reference_evidence: every official Pulseq 3D reference uses a block pulse
      user_overridable: rf_pulse=
    - name: slab-selective
      rf_family: shaped sinc
      rf_duration: 3 ms, from Excitation
      selection_gradient: present on z
      intrinsic_rephasing: A_slab_rephase, combined into the shared z winder
      encoding_role: z carries slab rephasing AND partition encoding in one window
      reference_evidence: fmrifrey/lps, the only witness
      user_overridable: rf_pulse=, rf_time_bw_product=
  excluded_caller_policy:             # [RECONSTRUCTED] working_hypothesis.policy_above_the_kernel
    - which lines and partitions are acquired, and in what order
    - dummy shots, TR fill, slab ordering
    - whether a GRE3D imaging class exists at all
  excluded_pulseq_artifacts:          # [VERBATIM] acceptance_criterion.md section 2
    - event decomposition -- R4b's two-event z construction is not binding
    - block count
    - raw sample-position agreement on x -- the reference has no DC sample where CartesianLine
      puts one, so the comparison is on lattice and semantic centre

acceptance:                           # [VERBATIM in substance] the pilot DID write this, as
                                      # gre3d/acceptance_criterion.md, before extraction.
                                      # Only the structure is new.
  claim: >
    GRE3DTR is an independent implementation of a 3D Cartesian gradient-echo repetition,
    reproducing the physical encoding of the Pulseq references without sharing their event
    structure.
  criterion: lattice-and-semantics
  tolerance: >
    dk agreement on three axes to the printed precision (5.000 / 5.000 / 6.250 1/m); every probed
    line and partition lands on the index asked for
  defined_before_extraction: true     # acceptance_criterion.md states this explicitly:
                                      # "Written before extraction, deliberately."
  establishes:
    - the non-selective path reproduces the reference's three-axis lattice and semantic centres
    - the slab-selective path satisfies the signed-moment arithmetic and the three degenerate
      limits, which depend on no external implementation
    - TE does not depend on kz, and the reported TE equals the compiled RF-centre-to-k0 time
    - the slab rephaser is realised once
  does_not_establish:
    - that GRE3DTR and the reference are the same sequence -- event identity is explicitly NOT
      the criterion on either path
    - that the slab-selective path agrees with any executable reference; none exists, and R4b
      ships no .seq
    - that the two z constructions produce identical images; the combined-vs-sequential
      comparison in examples/gre_3d/02 is separate evidence at one protocol
    - anything about non-Cartesian or partial-Fourier 3D variants, out of scope

validation:
  generic_measurements:
    - three-axis lattice and semantic centre from the compiled sequence
    - moment integration from the RF effective centre
  family_checks:                      # [VERBATIM] validation.* keys, restated as a list
    - 'non-selective against gre3d.seq: dk 5.000 / 5.000 / 6.250 1/m, every probed index lands
       where asked'
    - 'slab-selective: signed-moment arithmetic and three degenerate limits'
    - 'limits: non-selective, centre-partition and adjacent-partition pass in both modes'
    - 'polarity: the limiting edge follows the sign of the slab term and switches with it'
    - 'timing: implicit timing is the shortest legal design; the window lengthens automatically
       (thin slab, 64 partitions, 260 -> 1110 us); impossible timing is refused naming the
       limiting partition'
    - 'double emission: guarded structurally and by measurement'
  metamorphic: []                     # [NOT RECORDED] no metamorphic test was defined for this
                                      # candidate; the degenerate limits play a related role but
                                      # were not framed as transformations
  parameter_sweep: >                  # [RECONSTRUCTED] candidates/gre3d/run_validation.py output
    7 sweep cases: reference geometry, unequal ny/nz, thin slab with many partitions, slab equal
    to / below / above fov_z, and a sharper slab.
  emitted_inspection:                 # [RECONSTRUCTED] inspect_emitted.py output recorded in
                                      # mode_contract.md.  Rule B fires because modes is non-empty.
    - mode: non-selective
      file: examples/gre_3d/seq/gre_3d_nonselective.seq
      reads_as: 2 samples, hard / block, 0.200 ms, gradients on no axis -> NON-selective
    - mode: slab-selective
      file: examples/gre_3d/seq/gre_3d_slab.seq
      reads_as: 3000 samples, shaped / soft, 2.999 ms, gradients on ['z'] -> spatially selective
  layers:                             # [RECONSTRUCTED] the ladder was defined during this pilot
                                      # and is recorded in the PR body rather than the yaml
    layer_1: GREEN
    layer_2: GREEN                    # examples/gre_3d/01, in the notebook smoke suite
    layer_3: GREEN                    # examples/gre_3d/02, 3D FFT in three planes
    layer_3_reason: >
      Not deferred.  The oracle is a Cartesian 3D FFT, which needs no promotion, and the layer
      caught three mistakes no Layer-1 check could see: a sequential arrangement stacked at too
      short a TR, a comparison missing its spoiler, and a phantom passed unbuilt.
  package_suite: 985 passed / 19 skipped    # [VERBATIM]
  compiler_changes: none              # [VERBATIM]

hazards:                              # [VERBATIM] -- kept; the schema does not require it and
                                      # does not mind it
  - id: double-emission
    what: >
      If the kernel realises A_slab_rephase + A_partition on z, Excitation must not also emit its
      standalone rephaser.
  - id: unsigned-worst-case
    what: >
      Assuming the last partition, or the largest |A_partition| before combining, is the limiting
      one.  It is only limiting after the signed sum.

dependency_impact:
  # [RECONSTRUCTED] The pilot wrote this as prose in mode_contract.md; no classified map existed.
  # Consumers of Excitation found by searching for CONSTRUCTION on the current tree.
  # Scope: rephaser_area_per_m is a new read-only property; build(rephase=) defaults to True, so
  # existing behaviour is unchanged and a test pins the default events by content hash.
  # Three construction sites only -- gre_2d_tr, tse_shot, gre_3d_tr.  IRPrep builds its own
  # inversion pulse and does not compose Excitation, which a search for the class NAME would
  # have suggested it does.
  - consumer: src/seqcraft/modules/kernel/gre_2d_tr.py
    relation: direct
    classification: NO_BEHAVIOR_CHANGE
    note: default rephase=True pins the previous events by content hash
  - consumer: src/seqcraft/modules/kernel/tse_shot.py
    relation: direct
    classification: NO_BEHAVIOR_CHANGE
  - consumer: src/seqcraft/modules/kernel/gre_3d_tr.py
    relation: direct
    classification: INTENTIONAL_BEHAVIOR_CHANGE
    note: the candidate; the only caller that passes rephase=False
  - consumer: src/seqcraft/modules/imaging/gre_2d.py
    relation: transitive via GRE2DTR
    classification: NO_BEHAVIOR_CHANGE
  - consumer: src/seqcraft/modules/imaging/fse_2d.py
    relation: transitive via TSEShot
    classification: NO_BEHAVIOR_CHANGE
  - consumer: examples/ -- every build notebook composing Excitation
    relation: notebooks
    classification: NO_BEHAVIOR_CHANGE
    note: all build notebooks re-execute in the smoke suite

status: NEW_KERNEL                    # [VERBATIM]
traffic_light: GREEN                  # [VERBATIM]
reason_code: null
decided_by: human
found_during_implementation:          # [VERBATIM] -- kept
  - >
    TE was short by exactly the winder -- CartesianLine.time_to_echo() already carries the
    prephaser it was designed with.  Caught by comparing the compiled TE against the reported
    one, which a design-against-itself test would have missed.
  - >
    Inheriting spoil_axis=('x','z') put a spoiler on the axis already carrying the partition
    rewinder, and the two summed past the slew limit.  The default is now ('x',), which is what
    writeGradientEcho3D.m does.
  - >
    The non-selective mode first shipped with Excitation's 3 ms shaped sinc and no gradient --
    "mode B = mode A minus Gz".  Internally consistent, legally compiled, fully passing, and not
    the experiment the mode's name promised.  Minimum TE 4.377 -> 2.977 ms once fixed.  This is
    the failure that produced rules A and B.
open_questions:                       # [VERBATIM]
  - Is the three-axis window solve now worth a private helper?  Third instance.
  - Does GRE3D (imaging) follow, and when?  Not on this evidence.
  - No metamorphic test was defined; should the degenerate limits be reframed as transformations?
