#   python tools/module_mining/schema.py <this file>

id: spiral-readout
name: SpiralReadout             # PR23 called it Spiral2D; the name is not the finding

capability:
  summary: >
    A variable-density spiral arm: the Nyquist path, its slew- and amplitude-limited traversal,
    the arbitrary gradients that realise it, the segmented ADC the interpreter's sample limit
    forces, and the trajectory measured off what is actually emitted.
  family: readout

target:
  layer: readout
  path: src/seqcraft/modules/readout/spiral_readout.py   # PROPOSED; not written
  composes: [spoiler]
  extended: []                  # none proposed.  The compiler change is NOT part of this.
  untouched:
    - the compiler and LogicBlock -- the m1 defect is real and belongs in its own PR
    - CartesianLine, EPI2D, RadialReadout, Excitation, Refocusing, PhaseEncode, IRPrep
  not_created:
    - SpiralPath, SpiralTraversal -- an internal lowering boundary, not two public modules
    - SpiralInterleaf -- an interleaf is a call, as RadialReadout settled
    - GRESpiral2D, SESpiral2D -- composition until a second consumer appears
    - any promotion of the three PR23 helpers -- one consumer each

reuse_rationale: >
  The path and its traversal are one contract with a one-way coupling: a path is meaningful
  without a scanner, no traversal is meaningful without its path, and nothing wants to swap
  traversal policies on a fixed path.  Rotation, ordering and the surrounding sequence are not.

evidence:
  - repo: bughht/SeqCraft
    commit: feat/spiral-2d
    path: src/seqcraft/modules/readout/spiral_2d.py
    license: MIT
    role: primary
    executable: executed        # by its author; NOT re-executed here -- it is 36 commits behind main
    covers: the whole candidate, plus nine documented failure modes
    independence: >
      NOT an independent witness.  It is this project's own prior attempt, so agreement with it
      would be agreement with ourselves.  Its value is as an evidence corpus -- especially its
      FAILURES, which are the part no external reference records.
  - repo: pulseq/pulseq
    commit: 2fd6ab6
    path: matlab/demoSeq/writeSpiral.m
    license: MIT
    role: authoritative-external
    executable: documentary       # ships no .seq; read for physics, as R4b was for GRE3D
    covers: >
      Archimedean path, slew/amplitude-limited traversal, ADC segmentation, spiral-OUT only.
      NOT variable density, NOT a rewinder, NOT in / in-out / out-in, NOT multi-echo.
    independence: >
      Independent of PR23 and independently arrives at the path/traversal separation.  It ENDS AT
      FULL GRADIENT and is spiral-out only -- which is the same fact twice, and confirms PR23's
      failure A by exhibiting it.  See reference_review.md.
  - repo: usc-mrel/rtspiral_pypulseq
    license: GPL-3.0
    role: architecture-evidence
    executable: documentary
    covers: trajectory design separated from rewinders and assembly
    independence: >
      Independent of both.  COPYLEFT -- physics and invariants only, never implementation text,
      and it cannot be acceptance evidence for an MIT module.

contract:
  intrinsic: >
    Given field of view, matrix, shots, density and dwell, the module determines the path, its
    traversal under this scanner's limits, every emitted sample, every instant at which the path
    crosses the origin, and the ADC segmentation the sample limit forces.  One arm, designed once
    at rest at both ends; the variant chooses how many and in which order.
  endpoint_policy: >
    DURABLE: every arm begins and ends at g = 0, in every mode including `out`.  writeSpiral.m
    ends its spiral-out at full gradient and ramps down inside the spoiler, which is coherent for
    a family of one and incompatible with reversibility -- an arm ending at full gradient
    time-reverses into one starting there.  So SeqCraft's `out` differs from the reference at its
    tail deliberately, and no event-level similarity is claimed near the end.
  invariants:                   # PROPOSED; none measured in this phase
    - the reported trajectory equals the compiled one within a characterised floor (failure C)
    - the assembled waveform's end-of-block k is the origin (failure E)
    - k = 0 falls inside a sampling window, not in an ADC guard (failure D)
    - every arm begins and ends at zero gradient, so any variant joins continuously
    - measured turn spacing matches 1/density everywhere
    - the spoke at angle phi is the spoke at 0, rotated -- as RadialReadout already asserts
  varying_parameters: [fov_mm, matrix, shots, density, dwell_s, angle_rad, variant, echoes]
  modes:                        # Full table in mode_contract.md; summarised here.
                                # STAGE SCOPE IS ALL FOUR.  Starting from `out` is an
                                # implementation sequence, not an out-only abstraction.
    - name: out
      path_order: 0 -> k_max
      k_zero_instants: 1, the first sample
      endpoints: g = 0 at both ends
      prephase: not required
      rewind: required
      join: none
      multi_echo_transition: flyback k_max -> 0
      reference_evidence: writeSpiral.m -- path, extent, traversal, ADC segmentation
    - name: in
      path_order: k_max -> 0
      k_zero_instants: 1, the last sample
      endpoints: g = 0 at both ends
      prephase: required
      rewind: not required
      join: none
      multi_echo_transition: flyback 0 -> k_max
      reference_evidence: NONE -- analytic and metamorphic only
    - name: in-out
      path_order: k_max -> 0 -> k_max
      k_zero_instants: 1, the seam, which must fall INSIDE a sampling window
      endpoints: g = 0 at both ends
      prephase: required
      rewind: required
      join: at k = 0, continuous because both arms are at rest there
      multi_echo_transition: none -- consecutive units share an endpoint
      reference_evidence: NONE -- analytic and metamorphic only
    - name: out-in
      path_order: 0 -> k_max -> 0
      k_zero_instants: >
        TWO, at both ends.  The one asymmetry in the family, and the reason the reported echo
        instants must be a SEQUENCE from the first implementation.
      endpoints: g = 0 at both ends
      prephase: not required
      rewind: not required
      join: at k_max
      multi_echo_transition: none
      reference_evidence: NONE -- analytic and metamorphic only
  excluded_caller_policy:
    - the angle schedule and the order arms are played in
    - the excitation, the refocusing, TR, and whether this is a GRE or a SE
    - the reconstruction
  excluded_pulseq_artifacts:
    - block splits, and which ADC event a sample belongs to
    - whether joins are triangles inside the arm or separate events

acceptance:
  claim: >
    TWO-TIER, and the tiers must not be summarised as one.  (a) For spiral-out: the emitted
    trajectory agrees with writeSpiral.m's at matched geometry, and the ADC segmentation respects
    the same sample limit.  (b) For in / in-out / out-in and for multi-echo: ANALYTIC ONLY -- the
    reversed arm's integrated trajectory is the forward arm's reversed, and k = 0 falls inside a
    sampling window -- because no independent witness for those exists.
  criterion: trajectory-agreement     # tier (a); tier (b) is invariant-only
  tolerance: >
    MUST be characterised on the representation floor, not inherited from PR23's number.  My own
    measurement puts the compiler round-trip at ~6e-6 1/m (m0) for a split arbitrary gradient;
    PR23 reports 1.3-4.7e-5 1/m between its k_per_m and sc.kspace.  Same order, different
    measurements, and neither is yet a justified tolerance.
  defined_before_extraction: true     # vacuously: nothing extracted
  establishes:
    - the m1 compiler defect is real, reproduced with no Spiral module present
    - the path/traversal coupling is one-way, so it is an internal boundary and not a public one,
      and writeSpiral.m arrives at the same separation independently
    - >
      `echoes` and `variant` both belong to the readout -- they change gradient continuity, ADC
      regions and where k = 0 falls, which are its correctness conditions
    - >
      all four variants fit ONE SpiralReadout: one path/traversal model, one hardware solve, one
      trajectory representation, one ADC ownership model, one invariant set, and no unrelated
      parameter becomes conditional on the mode (mode_contract.md section 7)
    - >
      `out-in` crosses the origin TWICE, so the durable contract requires the reported echo
      instants to be a sequence from the first implementation -- free now, expensive later
    - none of the three PR23 helpers has a second consumer on current main, including after PR #27
    - PR23's reconstruction placement decision (examples/, not src/) is correct
    - the reconstruction's trajectory container is trajectory-AGNOSTIC; a radial acquisition fits
      it unchanged, and only the analytic-density DCF method is spiral-specific
  does_not_establish:
    - that the in / in-out / out-in variants agree with any external implementation; none exists
    - that `density` is the right convention; writeSpiral.m has no density parameter at all, so
      sampled-FOV-multipliers has ONE witness (PR23) and its lineage is a third source (vds.m)
    - that PR23's m0 claim is a defect -- it did not reproduce
    - anything measured about spiral physics; no reference was executed in this phase
    - which parts of the reconstruction are trajectory-agnostic; the file was listed, not read

validation:
  generic_measurements:
    - compiler m0/m1 round-trip on raw sign-changing arbitrary gradients, swept over knots
      and amplitude (tools/module_mining/candidates/spiral/run_compiler_claims.py)
  family_checks: []             # none run -- archaeology phase
  metamorphic: []
  parameter_sweep: not run
  emitted_inspection: []
  layers:
    layer_1: NOT_APPLICABLE
    layer_2: NOT_APPLICABLE
    layer_3: NOT_APPLICABLE
    layer_3_reason: >
      Nothing implemented.  Layer 3 for a spiral additionally needs the non-Cartesian
      reconstruction whose promotion is itself deferred -- see radial/evidence_state.yaml.
  compiler_changes: none made

evidence_state:
  human_review: NEEDED          # boundary approved; the mode contract is written and awaits review
  experiment_design_review: NOT_NEEDED
  scanner_validation: FUTURE
  deferred:
    - what: >
        Simulation and reconstruction of any spiral acquisition -- Layer 3.
      why: >
        Needs the non-Cartesian reconstruction whose promotion is itself deferred.  The trajectory
        claims are carried more directly by emitted-trajectory measurement than an image would
        carry them.
      revisit_trigger: The reconstruction contract question is settled either way.
    - what: >
        An independent witness for the in / in-out / out-in variants and for multi-echo.
      why: >
        writeSpiral.m ends at full gradient and is spiral-out only, so it cannot witness them.
        They are admissible on analytic evidence -- the GRE3D slab-selective precedent -- but the
        claim must say which tier it is in, and tier (b) has no external corroboration.
      revisit_trigger: >
        A permissively licensed reversible-arm spiral appears, or a claim is made about those
        variants that analytic evidence cannot carry.
    - what: A second witness for the `density` convention.
      why: >
        writeSpiral.m has no density parameter.  Sampled-FOV-multipliers has one witness, and
        PR23's own failure B shows the convention is exactly where silent errors live.
      revisit_trigger: Variable density is proposed for implementation.
    - what: A decision on whether the reconstruction's shared contract is promoted anywhere.
      why: >
        The audit found one exists and is small, which is what the Radial trigger asked.  What to
        do about it is separate, and example-only remains valid.
      revisit_trigger: A second non-Cartesian readout ships, making the two consumers real.
    - what: Hardware evidence -- gradient delay, eddy currents, trajectory fidelity.
      why: >
        A spiral is more sensitive to all three than any Cartesian readout, but none of them is
        needed to establish a software trajectory claim that an independent reference comparison
        covers more directly.
      revisit_trigger: >
        A claim is made about measured trajectory fidelity on a real system, or an image artefact
        appears that a correct design trajectory cannot explain.

status: UNDECIDED
