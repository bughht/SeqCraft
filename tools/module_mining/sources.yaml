# The scan-source registry.
#
# Every corpus the mining workflow is allowed to scan, with the two judgements that must be made
# BEFORE anything is mined from it: what kind of source it is, and what its licence permits.
#
# The registry exists because those two judgements kept being made per-candidate, in prose, and
# re-made from scratch each time.  `role` here is a property of the CORPUS.  It does not decide
# `evidence[].role` for any individual candidate -- see `per_candidate_questions` at the end.
#
#   discovery       tells us a family exists and is worth looking at
#   design-witness  an implementation whose construction can corroborate another's
#   oracle          an independent measurement path, for validating rather than designing
#   educational-synthesis
#                   a curated secondary account of established physics -- not code, and not a
#                   primary source.  Good for the canonical definition of a family and for the
#                   mental model a practitioner is taught; it does NOT outrank a handbook, a
#                   review or a primary paper, and it settles nothing those disagree with.
#
# A corpus may be more than one.  It is never automatically a design-witness just because it
# contains working sequences.

registry_version: 4
updated: 2026-09-23

sources:

  # ---------------------------------------------------------------- official Pulseq lines
  - id: pypulseq
    repo: imr-framework/pypulseq
    commit_scanned: f2c582b
    license: MIT
    compatible_with_seqcraft_mit: true
    roles: [discovery, design-witness]
    language: python
    executable: yes
    covers: >
      GRE, multi-echo GRE, GRE-EPI, SE-EPI, TSE/FSE/HASTE, MPRAGE, radial GRE, UTE, 3D MPRAGE.
    independence_note: >
      The reference line most SeqCraft modules are measured against.  Many of its examples are
      ports of the MATLAB demoSeq originals -- treat agreement between the two as ONE witness
      unless the specific files are shown to be independently derived.

  - id: pulseq-matlab
    repo: pulseq/pulseq
    commit_scanned: 2fd6ab6
    license: MIT
    compatible_with_seqcraft_mit: true
    roles: [discovery, design-witness]
    language: matlab
    executable: documentary
    ships_seq_files: true
    covers: >
      The demoSeq corpus: GRE, TSE, HASTE, EPI, MPRAGE, radial, UTE, spiral, bSSFP, ZTE/PETRA,
      PRESS/semi-LASER, diffusion, fat saturation, cine and label demos.  Several ship .seq files,
      which makes them measurable under the Python-only constraint without a MATLAB run.
    independence_note: >
      Original of many pypulseq examples.  See above.
    # Corrected 2026-09-21 by the post-v0 batch scan.  Diffusion had been represented in this
    # registry ONLY by the AGPL `pulseq-diffusion` entry, which understated the evidence: this
    # corpus holds an MIT diffusion implementation, and it has no PyPulseq counterpart to be a
    # port of.  It is therefore usable as a design-witness, not merely for discovery.
    notable_files:
      - path: matlab/demoSeq/writeEpiDiffusionRS.m
        family: diffusion weighting (Stejskal-Tanner, single refocused, ramp-sampled EPI)
        license: MIT
        role_for_that_family: design-witness
        no_pypulseq_counterpart: true
        what_it_witnesses: >
          Monopolar diffusion gradients placed either side of the refocusing pulse, with the
          timing windows `small_delta` and `big_delta` DERIVED from TE and the RF/EPI timing, and
          the amplitude then solved by inverting the analytic b-factor.  So it witnesses the
          direction `TE given -> b achievable -> amplitude`.
        stated_limits: >
          Its own b-factor helper is documented for rectangular gradients with
          "for trapezoid gradients: TODO", so the shipped physics IGNORES THE RAMPS.  A comparison
          against it establishes the monopolar structure and the timing derivation; it does not
          establish an exact b-value.
      - path: matlab/demoSeq/writeEpiDiffusionRS_PMC.m
        family: the same, with prospective motion correction
        license: MIT
        role_for_that_family: discovery
        note: shares the same b-factor helper, so not an independent witness of it.
      - path: matlab/demoSeq/writeTrufi.m
        family: bSSFP / TrueFISP
        license: MIT
        role_for_that_family: design-witness
        what_it_witnesses: >
          TE = TR/2, alternating RF phase, balanced moments, and an alpha/2 preparation.  TR is an
          OUTPUT of the ADC duration rather than an input.  Independent of OpenMRF's bSSFP, which
          catalyses with a flip-angle ramp instead -- see the openmrf entry.

  # ---------------------------------------------------------------- research repositories
  - id: openmrf
    repo: OpenMRF/openmrf-core-matlab
    commit_scanned: fd03604
    license: MIT for original OpenMRF work, third-party components covered separately
    compatible_with_seqcraft_mit: true
    roles: [discovery, design-witness]
    language: matlab
    executable: documentary
    covers: >
      Modular preparation library (FAT, SAT, inversion, T2, spin-lock, CEST); bSSFP, EPI, GRE,
      radial, spiral, TSE, UTE, PRESS readouts; trajectory design separated from assembly.
    independence_note: >
      Developed separately from the Pulseq lines; a genuine second witness where it overlaps.

  - id: fmrifrey-lps
    repo: fmrifrey/lps
    commit_scanned: 552d87a
    license: MIT
    compatible_with_seqcraft_mit: true
    roles: [design-witness]
    language: matlab
    executable: documentary
    covers: 3D Cartesian GRE with slab-selective excitation.
    independence_note: >
      Independent of the Pulseq house style.  Was the only witness to GRE3DTR's slab-selective
      path.

  - id: pulseq-cest
    repo: kherz/pulseq-cest
    license: MIT
    compatible_with_seqcraft_mit: true
    roles: [discovery]
    language: matlab
    covers: CEST preparation protocols, reusable saturation-period concepts.

  - id: pulseq-diffusion
    repo: ritagnunes/PulseqDiffusion
    commit_scanned: 0517ae1
    license: AGPL-3.0
    compatible_with_seqcraft_mit: false
    roles: [discovery]
    language: python
    covers: single- and twice-refocused DWI, b-value and direction handling.
    constraint: >
      COPYLEFT.  Extract physics and invariants only.  No implementation text may be copied or
      adapted into SeqCraft.
    # Added 2026-09-21 by the post-v0 batch scan.
    independence_note: >
      NOT the only diffusion source, and not the one to reach for first.  `pulseq-matlab` holds an
      MIT diffusion implementation -- see its `notable_files` -- and that is the usable
      design-witness.  What is unique here is the OPPOSITE solve direction: `opt_TE_bv_SE` and
      `opt_TE_bv_TRSE` find the minimum TE for a TARGET b-value, single- and twice-refocused,
      where the MIT witness takes TE as given.  It also carries `calc_exact_bval` beside
      `calc_bval`, so it has the ramp-inclusive physics the MIT witness marks TODO.
      **The harder direction and the more complete physics are the copyleft ones.**  Any candidate
      that needs them must re-derive analytically.

  - id: rtspiral
    repo: usc-mrel/rtspiral_pypulseq
    license: GPL-3.0
    compatible_with_seqcraft_mit: false
    roles: [discovery]
    language: python
    covers: 2D/3D real-time spiral; trajectory design separated from rewinders and assembly.
    constraint: COPYLEFT.  Extract physics and invariants only.

  - id: open4dflow
    repo: BAMMri/Open4DFlow
    commit_scanned: 9e752d8
    license: GPL-3.0
    compatible_with_seqcraft_mit: false
    roles: [discovery]
    language: python
    covers: velocity encoding, first-moment gradient design, cardiac triggering, 4D flow.
    constraint: COPYLEFT.  Extract physics and invariants only.
    # Added 2026-09-21 by the post-v0 batch scan.
    independence_note: >
      It does not design its velocity-encoding gradients in closed form.  It computes M0 and M1
      analytically for the imaging gradients that are already present, forms the RESIDUAL moment
      requirement per axis -- target M1 minus what the readout and slice gradients contribute --
      and delegates realisation to `gropt`, caching by the moment pair.  So it is one witness to
      the requirement MODEL, and zero witnesses to any closed-form construction.  See the `gropt`
      entry.

  # ---------------------------------------------------------------- added 2026-09-19
  - id: mrzero-core
    repo: MRsources/MRzero-Core
    commit_scanned: 5732d86
    path: documentation/playground_mr0/
    license: AGPL-3.0
    additional_terms: EULA.txt, a separate end-user licence agreement covering the MRtwin code
    compatible_with_seqcraft_mit: false
    roles: [discovery, oracle]
    explicitly_not: design-witness
    language: python
    executable: yes
    maintained: true
    covers: >
      FID; SE/CPMG; STE (3 pulses, 5 echoes); FLASH/GRE and GRE-to-FLASH; EPI; DWI SE-EPI;
      diffusion-prep STEAM; RARE and RARE multi-shot; TSE 2D multi-shot; bSSFP; DREAM (STE and
      STID); plus pTx, RF shimming and optimisation notebooks.
    maintenance_signal: >
      26 notebooks in documentation/playground_mr0/.  A defined subset of 12 is exercised twice:
      by .github/workflows/playground_test.yml, which executes each notebook end to end in a
      matrix, and by tests/simulation_test/, which compares simulated signal against stored
      reference files at MAG_NRMSE and PHASE_NRMSE tolerances of 0.01.  The subset is:
      FID, SE_CPMG, STE_3pulses_5echoes, FLASH_2D, EPI_2D, DWI_SE_EPI, diffusion_prep_STEAM_2D,
      RARE_2D, TSE_2D_multi_shot, GRE_to_FLASH, bSSFP_2D, DREAM_STE.
    independence_note: >
      **NOT independent of PyPulseq for sequence construction.**  21 of the 26 playground
      notebooks import pypulseq, and the test workflow pins `pypulseq==1.4.2post1`.  The
      sequences are BUILT with PyPulseq and SIMULATED with MRzeroCore, so a playground notebook
      agreeing with a PyPulseq example is one design agreeing with itself.

      Where MRzero IS independent is the other direction: the Bloch simulation is a measurement
      path developed separately from Pulseq, which is why `oracle` is in its roles and
      `design-witness` is explicitly excluded.
    constraint: >
      COPYLEFT, and an additional EULA beyond the AGPL.  Extract physics, invariants and the
      existence of families only.  No implementation text, and provenance must be re-checked
      before any use beyond discovery.  The AGPL/EULA combination is more restrictive than the
      GPL sources above; treat any proposal to depend on it as a licensing question first.

  # ---------------------------------------------------------------- added 2026-09-22
  # Admitted during the C1 T2-preparation fine scan, which needed a permissively licensed witness
  # for a NON-adiabatic realisation.  It is one, and it is a good one.
  - id: ptb-mrseq
    repo: PTB-MR/mrseq
    commit_scanned: df03749
    license: Apache-2.0
    compatible_with_seqcraft_mit: true
    roles: [discovery, design-witness]
    language: python
    executable: yes
    maintained: true
    covers: >
      A `preparations/` package -- t2_prep, t1rho_prep, t1_inv_prep -- beside a `sequences/`
      package holding T2-prep FLASH, MOLLI bSSFP, inversion-recovery SE and GRE, multi-echo SE,
      T2* multi-echo FLASH, spiral and radial FLASH, GRPE Dixon, EPI, and a cardiac MRF spiral.
      Also trajectory helpers (vds, spiral and Cartesian sampling).
    independence_note: >
      Built on PyPulseq, so it is NOT independent of the Pulseq line for low-level event
      construction -- the same caveat the pypulseq and pulseq-matlab entries carry.  What it IS
      independent of is OpenMRF, which is the comparison that matters for preparations: different
      institution (PTB, the German national metrology institute), different language, different
      structure, and a different realisation of the same physical family.  For any candidate where
      the question is "do two groups build this the same way", it is a genuine second witness.
      Per-candidate re-check still applies.
    notable_files:
      - path: src/mrseq/preparations/t2_prep.py
        family: T2 preparation
        role_for_that_family: design-witness
        what_it_witnesses: >
          A non-adiabatic MLEV-4 realisation, cited to Levitt & Freeman (1981) for the composite
          pulse and Brittain et al. (1995) for the T2-prep application.  Hard block pulses
          throughout; four composite refocusing pulses with the + + - - MLEV-4 phase pattern; a
          composite 270x / -360x tip-up; an optional single-axis z spoiler documented as not
          affecting the echo time.  Its public parameter is `echo_time`, defined as the time from
          the CENTRE of the excitation pulse to the CENTRE of the 270 tip-up pulse, and it raises
          a ValueError when that is too short for the requested pulse duration.
        measured_by_us: >
          Executed at seven protocols.  Realised echo time equals the request to 0.00 us, and the
          four refocusing points land at 0.1250, 0.3750, 0.6250 and 0.8750 of it -- the MLEV-4
          symmetric condition, exact.
        what_it_does_not_witness: >
          Any physical consequence.  Its own tests assert block-duration arithmetic and the
          short-echo-time refusal, and do not check that the realised echo time matches the
          request, the phase pattern, or the T2 weighting.

  # ---------------------------------------------------------------- added 2026-09-21
  # Admitted by the post-v0 batch scan.  It is NOT a sequence corpus, and that is why it is here:
  # a published 4D-flow implementation (open4dflow) does not construct its velocity-encoding
  # gradients from trapezoids at all -- it states a moment requirement and calls this.  So it is
  # discovery evidence about the SHAPE of a design problem SeqCraft cannot currently express,
  # which is the same kind of evidence a sequence corpus gives about a family.
  - id: gropt
    repo: mloecher/gropt
    commit_scanned: 7f07796
    license: GPL-3.0
    compatible_with_seqcraft_mit: false
    roles: [discovery]
    explicitly_not: [design-witness, oracle]
    language: c, with python and matlab wrappers
    executable: yes
    covers: >
      Constrained numerical gradient-waveform design.  Constraint families: peak gradient, slew
      rate, gradient moments of arbitrary order, and eddy currents.  Also a minimum-TE finder
      (`minTE_diff` / `test_TE_finder`) which searches for the shortest feasible TE satisfying a
      moment requirement, and simultaneous multi-axis optimisation.
    why_registered: >
      It is the only registered source that expresses a gradient design as a REQUIREMENT rather
      than as a waveform.  Its moment constraint is a 7-tuple --
      (axis, moment order, t=0 offset, window start, window end, target, tolerance) --
      and the `t=0 offset` field exists precisely so a moment can be constrained relative to a
      semantic instant OUTSIDE the waveform being solved, its documentation giving the example of
      an RF pulse that precedes the waveform.  That is "moments at semantic times" as a published
      interface, and it is the vocabulary a Phase C velocity/flow scan has to compare against.
    role_note: >
      Discovery only, and NOT a design-witness even for gradient design.  A witness corroborates
      how another implementation CONSTRUCTS something; this constructs nothing in closed form, so
      there is no construction to corroborate.  Nor an oracle: its output is a solution to a
      stated problem, not an independent measurement of a physical quantity.  What it witnesses is
      that the problem is posed this way by practitioners.
    constraint: >
      COPYLEFT.  Extract the problem formulation, the constraint vocabulary and the physics only.
      No implementation text, and no dependency: adding a GPL solver to SeqCraft's compile path is
      a licensing decision, not a design one, and is out of scope for any fine scan.

  # ------------------------------------------------------------- educational domain synthesis
  - id: mriquestions
    repo: n/a -- a website; see `url`
    url: https://mriquestions.com
    pages_cited:
      # Exactly the pages that have been read and cited.  The rest of the site is NOT scanned,
      # and this entry is not a licence to ingest it.
      - title: Driven Equilibrium
        url: https://mriquestions.com/driven-equilibrium.html
        author: A. D. Elster
        cited_by: plans/t2prep/candidate.yaml (E1)
    commit_scanned: n/a
    license: >
      Copyrighted educational site, all rights reserved.  CITED ONLY -- no text, figure or
      equation is reproduced, and nothing is derived from it that is not independently in the
      handbook literature.
    compatible_with_seqcraft_mit: not applicable -- nothing is copied
    roles: [educational-synthesis]
    explicitly_not: [design-witness, oracle]
    language: n/a
    executable: no
    covers: >
      Canonical definitions and mental models, one page at a time and only where a candidate
      needs one -- see `pages_cited`.  The site covers much more than that; scanning it broadly
      is deliberately not what this entry authorises.
    why_registered: >
      It answers one question the code corpus answers badly and the handbook answers slowly-
      "what does a practitioner consider the CANONICAL form of this family?".  That is exactly
      the question a fine scan has to separate from "what did this one implementation do".  Added
      2026-09-23, when a T2Prep realisation detail from a single implementation witness had been
      promoted into the reusable contract and the canonical picture was the simpler one.
    role_note: >
      **Weaker than the domain-reference class, and it must not be used to overrule it.**  It is a
      secondary account: it cites rather than establishes, and where it and a handbook or a
      primary paper differ, the stronger source wins and the disagreement is recorded.  It is
      never a design-witness -- it contains no construction to corroborate -- and never an oracle.
      Use it to identify the canonical form of a family and the vocabulary practitioners use for
      it, and then cite the primary source for the physics.

# ---------------------------------------------------------------------------------------------
# Per-candidate questions.  A corpus's registry entry does NOT answer these; they are re-asked
# for every candidate mined from it, because the answer can differ file by file.
per_candidate_questions:
  - reference independence -- relative to the OTHER references cited for THIS candidate
  - physical claim scope -- what a comparison against this source would and would not establish
  - shared implementation assumptions with PyPulseq/Pulseq -- the same arithmetic, the same
    house style, or a port?
  - discovery evidence or acceptance evidence -- does it tell us the family exists, or is it
    something the candidate is measured against?
  - licence and provenance constraints at the FILE level, not only the repository level
