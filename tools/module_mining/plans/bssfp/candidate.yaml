# Mirrored from the workspace planning repository (docs/plans/module-mining/) on 2026-09-22.
# See ../../README.md for which copy to edit.
# balanced SSFP -- post-v0 Phase C, second fine scan.  The boundary candidate.
#
# Entered WITHOUT `BalancedSSFPTR` as the expected answer.  Four boundary hypotheses were compared
# on what each can determine and state; the answer follows from those conditions.
#
#   python tools/module_mining/schema.py tools/module_mining/plans/bssfp/candidate.yaml

id: balanced-ssfp
name: bSSFPTR   # the kernel of a layered answer; see boundary_hypotheses

capability:
  family: kernel
  summary: >
    One balanced repetition of a steady-state free-precession acquisition.  Over the RF-to-RF
    interval the net gradient area on every axis is zero, the readout echo sits at a declared TE,
    and the RF carries a declared phase progression.  What the module CANNOT claim is that the
    magnetisation is in a steady state- that is a property of the train, not of the repetition.
  what_a_user_could_get_wrong: >
    (1) Confusing the SSFP condition with the balanced condition.  "Gradient area must not vary
    among TR intervals" is SSFP; "gradient area is zero during each TR interval" is balanced, and
    it is strictly stronger.  A sequence can satisfy the first and not the second, and it is then
    a different pulse sequence with different contrast -- SSFP-FID or SSFP-echo, not bSSFP.
    (2) Assuming TE = TR/2 is required.  It is the condition for the T2/T1 contrast the method is
    used for; away from it, T2-prime weighting enters.  Legal either way.
    (3) Believing a balanced, legal repetition means the magnetisation is in steady state.  It
    takes four to five times T1 to get there.
    (4) Phase progression- alternation is equivalent to a constant 180 degrees of precession per
    TR, so a sequence that already has that off-resonance condition loses the benefit.  This is
    what a band IS.

target:
  layer: kernel
  untouched:
    - src/seqcraft/compiler
    - src/seqcraft/design
    - src/seqcraft/modules/kernel/gre_2d_tr.py    # NOT refactored; see boundary_hypotheses.D
    - src/seqcraft/modules/imaging

evidence:
  - id: D1
    source: domain-reference
    repo: n/a -- a book; see `citation` and `curated_card`
    license: Copyrighted textbook.  CITED ONLY; no reproduction beyond short quotations.
    citation: >
      Bernstein, King & Zhou, Handbook of MRI Pulse Sequences, Elsevier 2004.  Chapter 14 "Basic
      Pulse Sequences", section 14.1 "Gradient Echo", subsection "Balanced SSFP (True FISP)",
      book pages 592-597; Figures 14.12 and 14.13, pages 600-601; Table 14.2, page 597.
    role: authoritative-external
    evidence_class: domain-reference
    independence: Not an implementation and not derived from any corpus here.
    curated_card: tools/module_mining/domain_evidence/bssfp.md
    what_it_establishes: >
      The two conditions and that they differ- SSFP requires the gradient area on any axis "must
      not vary among the TR intervals", and BALANCED imposes the "further condition" that it "is
      zero during each TR interval".  That the natural interval is RF-to-RF, and that showing the
      waveform's symmetry requires drawing the NEXT repetition's RF (Fig. 14.12 caption).  That
      TE = TR/2 is the condition for T2 rather than T2-star in the exponent, and that moving away
      from it introduces T2-prime weighting -- with partial-echo bSSFP at TE < TR/2 given as a
      named realisation (Fig. 14.13).  That RF sign alternation is equivalent to a constant 180
      degrees of precession per TR, so the phase progression is a frame convention.  That the
      approach to steady state takes four to five times T1, making "accelerating or catalyzing the
      approach to steady state ... an important
      practical problem" with several named solutions -- the alpha/2 with TR/2 scheme AND a linear
      flip-angle ramp.  And that Table 14.2 factorises a gradient-echo sequence into gradient
      waveform class x RF pulse train class x contrast formula.
    what_it_does_not_establish: >
      Whether TR is an input or an output -- it treats TR as a protocol parameter and never
      discusses a minimum.  Where a software repetition boundary should fall.  Anything about 2D
      against 3D or segmentation- section 14.1 is dimension-agnostic and nothing in the balanced
      subsection makes segmentation a property of the repetition.  How many start-up pulses
      suffice, or how to verify steady state was reached.
  - id: R1
    source: pulseq-matlab
    repo: pulseq/pulseq
    path: matlab/demoSeq/writeTrufi.m
    commit: 2fd6ab6
    license: MIT
    role: independent-implementation
    independence: >
      Independent of OpenMRF and of mrseq.  Has no PyPulseq counterpart, so the usual
      port caveat does not apply.
    what_it_establishes: >
      A 2D single-slice realisation, and the strongest structural evidence in the scan.  It
      "reshuffle[s] gradients to achieve a half-way optimal timing"- it SPLITS the slice gradient
      at the RF's end and recombines the rephaser of the PREVIOUS repetition with the selection
      of the current one, and splits the readout at the ADC's end and recombines its tail with the
      prephaser of the NEXT one.  Its own comment names the interval- the ringdown correction is
      "needed to center the ADC and the gradient echo in the center of RF-RF period".
      TR is an OUTPUT- "there is no user control for TR/TE, you just specify the ADC time", and
      TR = duration(gz_1) + duration(gx_1), TE = TR/2.  Its catalyzing method is alpha/2 with a TR/2 delay.
      Phase progression- pi*mod(i,2) on both RF and ADC.
    what_it_does_not_establish: >
      3D or segmentation.  Nor that its reshuffling is necessary rather than an optimisation- it
      is presented as timing optimisation, and the sequence would be balanced without it.
  - id: R2
    source: openmrf
    repo: OpenMRF/openmrf-core-matlab
    path: include_pulseq_toolbox/src_readouts/BSSFP/
    commit: fd03604
    license: MIT
    role: independent-implementation
    independence: Independent of the Pulseq demo line and of mrseq.
    what_it_establishes: >
      A 3D realisation, and that segmentation does not touch the repetition.  The per-repetition
      block sequence is fixed -- RF+slice, tr_fill, prephasers on x/y/z, readout+ADC, rewinders on
      x/y/z, tr_fill -- and `loop_y` and `loop_z` only select WHICH phase-encode and partition
      values are used.  TR is an INPUT with the fill split into two equal halves either side of
      the readout, and TE = TR/2 is set by construction.  Its catalyzing method is a LIST of flip angles
      (`exc_flipangle`, `n_FAs`) -- the linear ramp, which is the other scheme D1 names.
      Prephaser and rewinder share one duration (`t_pre_rew`) per axis.
    what_it_does_not_establish: >
      A TE independent of TR/2, which it does not offer.
  - id: R3
    source: ptb-mrseq
    repo: PTB-MR/mrseq
    path: src/mrseq/sequences/t1_molli_bssfp.py
    commit: df03749
    license: Apache-2.0
    role: independent-implementation
    independence: >
      Independent of OpenMRF and writeTrufi.  Built on PyPulseq for event construction, which is
      irrelevant here- the comparison is about repetition structure and start-up preparation, and no
      PyPulseq example implements bSSFP.
    what_it_establishes: >
      That TR is neither simply an input nor simply an output.  `tr: float | None` -- None means
      "use the computed minimum", a supplied value is used, and a value below the minimum is
      REFUSED.  Same for TE, which is an INDEPENDENT parameter with its own minimum and is NOT
      tied to TR/2 -- so the Handbook's partial-echo case is realised by a witness.
      Start-up preparation is `n_bssfp_startup_pulses` with a linear flip-angle ramp, counted and
      subtracted from the timing budget in units of the SAME TR -- so a start-up repetition is
      the ordinary repetition at a different flip angle.  Phase alternation of pi on both RF and
      ADC.  k-space ordering is a separate helper (`cartesian_phase_encoding`).
      Its steady state is INTERRUPTED per cardiac cycle, which is the case D1 names.
    what_it_does_not_establish: >
      3D.  Nor a non-alternating phase progression.
  - id: O1
    source: mrzero-core
    repo: MRsources/MRzero-Core
    path: documentation/playground_mr0/mr0_bSSFP_2D_seq.ipynb
    commit: 5732d86
    license: AGPL-3.0 plus EULA
    role: deferred
    evidence_class: oracle
    independence: >
      ORACLE ONLY, and explicitly not a design witness -- it builds with PyPulseq.  Not used in
      this pass; recorded because the steady-state claim is exactly what it could settle.
    what_it_establishes: nothing yet -- see validation.planned
    what_it_does_not_establish: >
      Anything about construction.  Its bSSFP notebook is in the CI-tested subset, so it is a
      usable oracle when a steady-state claim needs testing.

reference_situation:
  independent_witnesses: 3
  note: >
    Unusually good for this project- three implementations from three groups in two languages, one
    2D, one 3D, one cardiac-gated, plus an authoritative domain source and an available oracle.
    They AGREE on every physical condition and DISAGREE only on parameterisation, which is what
    made the boundary analysis tractable.
  what_they_agree_on: >
    Zero net gradient area per axis per repetition; the RF-to-RF interval; phase alternation on
    both RF and ADC; start-up preparation outside the repetition, in repetitions of the same length;
    k-space ordering outside the repetition.
  what_they_disagree_on: >
    TR as output (R1), input (R2), or input-with-a-floor (R3).  TE tied to TR/2 (R1, R2) or
    independent with a floor (R3).  Start-up by the alpha/2 method (R1) or a flip-angle ramp (R2, R3).
    **D1 resolves all three**- TR is a protocol parameter, TE = TR/2 is a contrast condition and
    not a constraint, and both catalyzing methods are named canonical alternatives.

contract:
  the_two_conditions:
    ssfp: gradient area on each axis does not VARY between repetitions
    balanced: >
      gradient area on each axis is ZERO over each repetition -- strictly stronger, and what makes
      it bSSFP rather than SSFP-FID or SSFP-echo
  semantic_interval:
    definition: RF centre of repetition n to RF centre of repetition n+1
    evidence: >
      D1's Figure 14.12 states the balance over "one TR interval" and draws the next repetition's
      RF to show the symmetry; R1's own comment says "the center of RF-RF period".  All three
      implementations place the readout echo at the centre of that interval by default.
  te_relationship: >
    TE is measured from the RF centre to the echo.  **Canonical symmetric bSSFP uses TE = TR/2,
    but the balanced condition itself does not require it** -- balance is the zero-area condition
    above and says nothing about where the echo falls.  The hierarchy the evidence supports is-

      defining bSSFP balance     zero net gradient area per axis over the TR
      canonical realisation      TE = TR/2, which is also the condition for T2 rather than
                                 T2-star weighting (D1 p. 593), and the default in all three
                                 witnesses
      valid variants             partial or asymmetric echo (D1 Fig. 14.13), and by extension
                                 UTE-bSSFP and dual-echo forms, each still balanced and each
                                 with different susceptibility / T2-prime behaviour

    So TR/2 remains the natural default for any future API.  An asymmetric TE is a legitimate
    variant rather than an equally canonical one, and R3 is the witness that exposes it.
  phase_progression: >
    Alternating 0 / pi on the RF, matched on the ADC.  D1- alternation is EQUIVALENT to a constant
    180 degrees of precession per repetition, so this is a frame convention rather than a free
    choice, and a region already precessing 180 degrees per TR loses the benefit -- which is what
    a band is.
  determinable_from_own_parameters:
    - the zero-area condition on every axis, over its own duration
    - the echo position within its own interval, and therefore TE
    - the minimum TR its own events admit
    - the gradient moments of every event it emits
  needs_from_outside:
    - the repetition index, for the phase progression
    - the phase-encode and partition values
    - the flip angle, which a start-up schedule varies
  cannot_state_at_all: >
    That the magnetisation is in a steady state.  D1- four to five times T1.  **This is the
    waveform-legality against steady-state-correctness distinction, and it is the reason the
    answer is layered.**

boundary_hypotheses:
  selected: D, with A as the kernel
  why: >
    A is the only hypothesis whose correctness condition is both stateable and checkable on one
    instance.  C cannot state its own correctness.  B cannot be expressed.  D is A plus
    composition, and composition is where every witness and the domain source put steady-state
    establishment and ordering.  The selection follows from those conditions and not from the class name -- and
    the name `bSSFPTR` is kept only because the unit it denotes turned out to be the right one.
  compared:
    - id: A
      name: RF-to-RF balanced repetition kernel (bSSFPTR)
      owns: balanced moments over its own interval, TE placement, RF phase, its own minimum TR
      can_determine: all of the above from its own parameters, given the repetition index
      correctness_condition: >
        "The net gradient area on each axis over my duration is zero, and my echo is at my
        declared TE."  Fully checkable on ONE instance, with no reference to neighbours.
      needs_from_outside: repetition index, encode values, flip angle
      what_becomes_awkward: >
        **Measured, not asserted.**  A module's events cannot continue into the next instance of
        itself, so the boundary must fall where every axis is at zero.  On the readout axis the
        rewinder of n and the prephaser of n+1 are then two trapezoids where the physics wants
        one- 380 us + 380 us against 540 us merged, so 220 us per repetition per axis, about
        5.5 % of a 4 ms TR on the readout axis alone.  The slice axis carries the same split
        between the excitation rephaser and the next selection lobe.  This is exactly what R1
        reshuffles away, and R1 can only do so because it is a script rather than a composable
        unit.
      sources_supporting: D1 Figure 14.12; R1's own "RF-RF period"; R2 and R3 both build this unit
      sources_contradicting: none on the physics; R1's reshuffling shows the cost is real
    - id: B
      name: a smaller balanced-requirement abstraction
      owns: the REQUIREMENT -- "net area zero on this axis over this interval" -- and no waveform
      can_determine: nothing on its own
      correctness_condition: >
        Stateable, and NOT checkable without the surrounding sequence, because the requirement is
        relative to whatever else plays on that axis.
      needs_from_outside: every other event on the axis, the time budget, the hardware limits
      what_becomes_awkward: >
        SeqCraft cannot express it.  A Module emits events computed in closed form from its own
        parameters; this would emit a constraint to be realised later.  It WOULD remove A's
        220 us, because a solver could realise one continuous waveform across the boundary.
      sources_supporting: >
        None directly -- no bSSFP witness works this way.  But it is the same shape Phase B found
        in Open4DFlow for velocity encoding, which is C3's subject.  **Two of the three Phase C
        candidates independently land on this one missing capability, which is the most useful
        thing this scan found.**
      sources_contradicting: not contradicted; simply unwitnessed for bSSFP
    - id: C
      name: a steady-state segment abstraction
      owns: steady-state establishment, N repetitions, and optionally the interruption and restore
      can_determine: a start-up schedule from a flip angle and a scheme; the dummy count
      correctness_condition: >
        "The magnetisation is in steady state by repetition k" -- **not checkable from the
        waveform at all.**  It needs T1, T2 and either a simulation or an analytic model, so the
        validation tooling would have to supply physics, which the ownership table forbids.
      needs_from_outside: T1 and T2, to know whether the start-up preparation worked
      what_becomes_awkward: >
        It would also have to own or accept k-space ordering, and it cannot state its own
        correctness.  D1 treats the approach to steady state as a practical problem with several named
        catalyzing methods,
        which is the signature of policy rather than of physics.
      sources_supporting: >
        All three witnesses put start-up preparation outside the repetition, and R3 counts its pulses
        in units of the same TR -- so a start-up repetition IS the ordinary one at another flip
        angle.
      sources_contradicting: >
        D1 gives at least three catalyzing methods and no criterion for choosing between them.
    - id: D
      name: layered -- kernel A, with start-up preparation and ordering as composition
      owns: A owns the repetition; a caller owns start-up preparation, segmentation and ordering
      can_determine: as A
      correctness_condition: as A, plus nothing it cannot check
      needs_from_outside: as A
      what_becomes_awkward: >
        Nothing new.  It matches what all three witnesses do, matches D1's Table 14.2
        factorisation of a gradient-echo sequence into waveform class x RF train class, and
        matches the shipped GRE2DTR precedent, whose dummy repetitions live in the example's loop
        rather than in the kernel.
      sources_supporting: D1 Table 14.2; R1, R2 and R3 all structure themselves this way
      sources_contradicting: none

two_d_versus_three_d:
  finding: >
    **Segmentation does not change the intrinsic repetition physics.**  R2 is 3D and its
    repetition is byte-for-byte the same structure as R1's 2D one; `loop_y` and `loop_z` select
    encode values and nothing else.  R3 is 2D and cardiac-gated, and what its segmentation changes
    is how many repetitions share one start-up preparation and how often the steady state is
    interrupted.
    D1's balanced-SSFP subsection is dimension-agnostic and says nothing that makes segmentation a
    property of the repetition.
  consequence: >
    A segment boundary carries **steady-state** physics, not bSSFP repetition physics- it is where
    start-up preparation is needed again, or where the magnetisation must be stored on the longitudinal
    axis and restored (D1 p. 595).  That belongs to the layer above the kernel, and the same
    kernel serves 2D and 3D.

acceptance:
  defined_before_extraction: true
  claim_scope: Scoped to hypothesis A as the kernel, with steady-state establishment explicitly outside it.
  establishes:
    - >
      Zero net gradient area on every axis over the RF-to-RF interval, measured on the emitted
      events' own knots rather than on the design values (rule E).
    - >
      The echo lands at the declared TE from the RF centre, measured on the compiled sequence via
      sc.kspace, which shares no code with the module.
    - >
      TE = TR/2 when the caller asks for it, and a legal sequence with the declared T2-prime
      consequence when the caller asks for something else.
    - >
      The RF and ADC phase progression read off the compiled file alternates as declared.
    - >
      Metamorphic- changing the phase-encode value changes only the phase axis's moments and
      leaves the balance, TE and phase progression unchanged.
    - >
      The module's stated minimum TR is the smallest TR it will build, and a shorter request is
      refused rather than silently lengthened.
  does_not_establish:
    - >
      **That the magnetisation is in a steady state.**  No waveform measurement can establish it;
      D1 puts the approach at four to five T1.  A train-level claim needing the oracle.
    - >
      Any contrast claim.  T2/T1 weighting follows from the steady state, not from the repetition.
    - Banding behaviour, which is an off-resonance property of the train and the object.
    - That start-up preparation worked, which the kernel does not own.

validation:
  layers:
    layer_1: NOT_APPLICABLE
    layer_2: NOT_APPLICABLE
    layer_3: NOT_APPLICABLE
    layer_3_reason: >
      NOT_APPLICABLE because nothing is implemented -- this fine scan stops at the acceptance
      claim.  Layer 3 is unusually important for this candidate when it is built- the steady-state
      approach and the T2/T1 contrast are the claims a user cares about and the ONLY layer that can
      test them.  MRzeroCore's bSSFP notebook is in its CI-tested subset, so the oracle exists.
  planned: >
    Layer 1 from acceptance.establishes, all on the emitted lattice.  Layer 2 as a complete
    acquisition with start-up preparation composed in the notebook, which is also where the 2D and 3D cases
    are shown to share the kernel.  Layer 3 against MRzeroCore- signal against repetition index
    for a train with and without start-up preparation, which tests the one claim the kernel cannot make.

coverage_classification: null
coverage_flags: [ARCHITECTURE_REVISIT_CANDIDATE]

status: NEW_KERNEL
traffic_light: APPROVED_FOR_IMPLEMENTATION

decision_summary: >
  The smallest reusable physical boundary whose correctness conditions cannot be separated is the
  **RF-to-RF balanced repetition**, and the answer is layered- that kernel, with steady-state
  establishment and
  k-space ordering as composition above it.

  The boundary follows from one test applied to four hypotheses- can this thing state a correctness
  condition it can also check?  The RF-to-RF repetition can -- zero net area per axis over its own
  interval, echo at its declared TE -- and can check it on a single instance with no reference to
  its neighbours.  A steady-state segment abstraction cannot- its claim is that the magnetisation
  has converged, which no waveform measurement reaches.  A balanced-requirement abstraction cannot
  be expressed at all.  So the kernel is the repetition, and everything the segment would have
  owned is policy that every witness and the domain source already place outside it.

  Domain evidence decided three things the code corpus obscured.  **TE = TR/2 is not an
  invariant** -- it is the condition for T2 rather than T2-star weighting, and partial-echo bSSFP
  at TE < TR/2 is a named realisation.  Two of three witnesses hard-wire TR/2 and would have
  taught us the wrong contract.  **Both catalyzing methods the witnesses use are canonical**, so
  their
  disagreement is two named alternatives rather than evidence about the boundary.  And **"balanced"
  is a strictly stronger condition than "SSFP"** -- area zero per repetition, not merely area
  constant across repetitions -- which no implementation states because each implements only one
  of the two.

  One quantified cost, and it is the architecture-revisit finding.  A module's events cannot
  continue into the next instance of itself, so a per-repetition boundary must fall where every
  axis is at zero.  On the readout axis that turns one 540 us lobe into two of 380 us -- **220 us
  per repetition per axis, about 5.5 % of a 4 ms TR** -- and the slice axis carries the same split.
  `writeTrufi` reshuffles exactly this away, and can only do so because it is a script rather than
  a composable unit.  SeqCraft's compiler already keeps a waveform continuous across RF and ADC
  seams INSIDE one module, measured at constant amplitude across both; what it cannot do is carry
  one across the repetition boundary.

  **That cost is the one thing a reviewer should decide before implementation starts.**  Accepting
  it ships a correct, composable kernel that is a few per cent slower than a hand-written script.
  Declining it waits for the capability C3 is about -- and the fact that bSSFP and velocity
  encoding arrive at the same missing capability from opposite directions is the most useful
  result of this scan.

open_questions:
  - >
    Accept the 220 us per axis per repetition, or wait for a way to express a balanced requirement
    across the boundary?  This is a product decision, not an evidence question, and it is the only
    thing blocking implementation.
  - >
    Should the kernel expose TE independently (R3) or derive TE = TR/2 (R1, R2)?  D1 says TE is
    free with a contrast consequence, so exposing it is the faithful choice; deriving it is the
    safer default.  Recommend exposing with TR/2 as the default and the T2-prime consequence
    documented.
  - >
    Does GRE2DTR share anything with this kernel?  Both are "one repetition- excite, encode, read,
    rewind".  They differ in the balance condition and the phase progression -- spoiled GRE is RF
    spoiled, bSSFP is sign alternated -- and D1's Table 14.2 factorises exactly along those two
    axes.  **Not investigated, and deliberately not refactored.**  Recorded because the
    factorisation suggests a shared repetition skeleton, which is an architecture question worth
    its own pass rather than a side effect of this one.

evidence_state:
  human_review: NEEDED     # the 220 us trade is a decision, not a measurement
  experiment_design_review: DONE
  scanner_validation: NOT_REQUIRED_FOR_CLAIM
  note: >
    Not required- every acceptance item is a waveform or timing measurement, and the steady-state
    claim the kernel explicitly does not make is what a scanner would be needed for.
  deferred:
    - what: The steady-state claim itself.
      why: >
        It is a train-level property, not a repetition property, and the kernel is scoped to
        exclude it.  D1- four to five times T1 to converge.
      revisit_trigger: >
        Layer 3 runs, or a caller wants the library to assert that a train has converged.
    - what: Start-up preparation as a shipped abstraction.
      why: >
        D1 names at least three catalyzing methods -- alpha/2 with TR/2, a linear flip-angle ramp,
        and ramp-down storage on the longitudinal axis -- and gives no criterion for choosing.  An
        abstraction with no correctness condition of its own is policy.  GRE2DTR sets the
        precedent- its dummy repetitions live in the example's loop.
      revisit_trigger: >
        Two schemes turn out to share a correctness condition a caller keeps getting wrong.
    - what: >
        Implementation of bSSFPTR itself.  **Deferred by review, 2026-09-22.**
      why: >
        The boundary finding is accepted -- RF-to-RF is the candidate kernel, steady-state
        establishment sits above it, and segmentation and ordering are acquisition policy.  What
        is NOT decided is whether to pay the measured 220 us per axis per repetition that forcing
        gradients to terminate at a module boundary costs.  That cost converges directly with the
        cross-boundary physical-requirement problem C3 studies, so deciding it now would be
        deciding it with one of the two relevant cases in hand.
      revisit_trigger: >
        C3 concludes.  Then either accept the cost and build the kernel, or build whatever C3
        shows is needed to avoid it.
    - what: >
        Whatever removes the 220 us -- and C3 has narrowed what that is.
      why: >
        Two readings, and they lead to different layers.
        (a) If the rewinder of repetition n and the prephaser of n+1 could be fused with NO change
        of physical semantics -- same integrated waveform, same RF and ADC timing, same
        requirements, merely a more efficient continuous representation -- then this is a
        candidate for a semantics-preserving optimisation in the COMPILER, and no bSSFP physics
        need go anywhere near it.
        (b) If the efficient form requires choosing the waveform with the balance target in view,
        it is physics-aware joint design and belongs to a joint owner in the MODULE layer, which
        is where C3's merged flow waveform lands.
        **Which of the two this is has not been established**, and the distinction matters more
        than the microseconds- (a) is a compiler optimisation available to every sequence, (b) is
        a new kind of kernel.
      revisit_trigger: >
        Phase E decides the ownership question.  **Do not recover the 220 us by teaching the
        compiler about bSSFP** -- that would be (b) implemented as (a).
    - what: Banding, CISS and multi-acquisition phase cycling.
      why: >
        D1 places them above the repetition- two acquisitions separately reconstructed and
        combined.  Acquisition and reconstruction policy.
      revisit_trigger: A candidate is scanned whose subject is phase-cycle combination.
    - what: Whether GRE2DTR and bSSFPTR share a repetition skeleton.
      why: >
        Table 14.2 factorises gradient-echo sequences into waveform class x RF train class, which
        suggests they do.  Refactoring a shipped kernel on the strength of a table is not
        warranted.
      revisit_trigger: >
        A third repetition kernel is proposed, making the shared part a real abstraction with
        three consumers rather than a hypothesis with two.

skill_observation:
  do_not_change_v0_yet: true
  domain_reference_changed_the_outcome: true
  how: >
    Second consecutive case, and more sharply than in C1.  Here the code witnesses were PLENTIFUL
    -- three independent implementations, the best evidence base in the project -- and they still
    would have taught the wrong contract.  Two of three hard-wire TE = TR/2, so a boundary derived
    from code alone would have made it an invariant; D1 says it is a contrast condition with a
    named realisation on the other side of it.  And no implementation states the SSFP-versus-
    balanced distinction, because each implements one of the two.
    **So the value of domain evidence is not a fallback for thin corpora.**  In C1 it established a
    family that one witness could not; here it corrected a contract that three witnesses agreed on.
    Those are different jobs, and only the second one was a surprise.
  what_v0_lacks: >
