# Provisional research record -- NOT a schema, NOT runtime code.
# Prospective supervised run, evidence phase.  Nothing implemented.
#   python tools/module_mining/schema.py <this file>

id: saturation-prep
name: SaturationPrep            # working name; EXTEND_EXISTING on Excitation is a live alternative

capability:
  summary: >
    A spectrally selective RF pulse played with no gradient, offset from water by a chemical
    shift, followed by a spoiler and no rephasing -- the magnetisation it creates is unwanted and
    is destroyed on purpose.
  family: preparation

target:
  layer: preparation
  path: src/seqcraft/modules/preparation/saturation_prep.py   # PROPOSED; not written
  composes:
    - Excitation      # provisionally; the pulse itself is already expressible
    - spoiler
  extended: []        # none proposed under NEW_LEAF.  Under the EXTEND_EXISTING alternative this
                      # would be excitation.py, and rule D would then fire.
  untouched:
    - IRPrep, the compiler, LogicBlock, every other module
  not_created:
    - a CEST saturation train -- different physics; see findings.md section 7
    - a regional/spatial saturation slab -- plays a gradient; the shared part is "prepare then
      spoil", which is the waveform-silhouette trap
  siblings_not_parents:
    - IRPrep -- same structural shape, different rf.use; neither contains the other

reuse_rationale: >
  The pulse and the spoiler are already expressible.  What is not is the chemical-shift offset
  with its sign convention, the bandwidth-does-not-touch-water relation, and rf.use='saturation'.
  Whether that is enough for a Module or should instead be an extension to Excitation is the
  question this record puts to review.

evidence:
  - repo: imr-framework/pypulseq
    commit: f2c582b
    path: examples/scripts/write_epi_se_rs.py
    license: MIT
    role: primary
    executable: executed
    covers: spectral fat saturation
    independence: >
      One witness with R2 (pulseq/pulseq writeEpiSpinEchoRS.m) -- same design, one ported from the
      other, identical flip, duration, bandwidth rule and spoil scale.  Independent of R3.
  - repo: pulseq/pulseq
    commit: 2fd6ab6
    path: matlab/demoSeq/writeEpiSpinEchoRS.m
    license: MIT
    role: authoritative-external
    executable: documentary
    covers: spectral fat saturation
    independence: >
      One witness with R1.  Differs from it in ONE line: it compensates the offset-induced phase
      at the RF centre and R1 does not.  A within-design disagreement, recorded not resolved.
  - repo: fmrifrey/lps
    commit: 552d87a
    path: gre3d/gre3d_write_seq.m
    license: MIT
    role: independent-formulation
    executable: documentary
    covers: spectral fat saturation
    independence: >
      Independent of the Pulseq house style -- the same judgement recorded during the GRE3D pilot.
      Genuinely a second design: 90 degrees not 110, 12 ms not 8, a fixed 200 Hz bandwidth rather
      than one derived from the offset, and the sign applied at the point of use.
  - repo: OpenMRF/openmrf-core-matlab
    commit: fd03604
    path: include_pulseq_toolbox/   # FAT / SAT preparation library
    license: MIT for original OpenMRF work
    role: deferred
    executable: documentary
    covers: possibly a third independent design
    independence: >
      UNINSPECTED -- no local checkout.  Recorded as an open item; nothing here depends on it.

contract:
  intrinsic: >
    Given a species' chemical shift in ppm and the scanner's B0, the module determines the pulse's
    centre-frequency offset and its sign, checks that the excited band does not reach water, emits
    the pulse with rf.use='saturation' and no gradient, and follows it with a spoiler and no
    rephasing.
  invariants:                # PROPOSED, none yet measured -- acceptance_options.md section 1C
    - the centre frequency equals ppm * 1e-6 * B0 * gamma, with the sign convention stated
    - the excited band does not overlap water
    - no gradient is played during the pulse
    - no rephasing gradient follows it
    - the spoiler dephases at least N cycles across the stated spatial scale
    - rf.use is 'saturation' in the emitted file
  varying_parameters:
    - species chemical shift in ppm
    - flip angle, duration, bandwidth, apodization   # protocol; the references disagree
    - spoiler cycles and spatial scale
  modes: []                  # no mode set proposed; rule A does not fire
  excluded_caller_policy:
    - when the preparation is played, and how often
    - what imaging train follows it
    - the protocol parameters above
  excluded_pulseq_artifacts:
    - whether the spoiler is a separate block or delayed inside the pulse's block
    - the pulse factory used, given an equivalent envelope

acceptance:
  claim: >
    PROPOSED, not yet asserted: at R1's protocol the candidate emits an RF waveform whose
    envelope, duration, centre frequency and spectral profile match R1's, plus a spoiler of the
    same moment; and the analytic spectral invariants hold independently of any implementation.
  criterion: invariant-only     # plus waveform agreement against R1; see acceptance_options.md
  tolerance: not yet set -- to be fixed against a measured floor before extraction
  defined_before_extraction: true
  establishes:
    - that two independent designs agree on structure, purpose and the spoil-do-not-rephase rule
    - that the pulse and spoiler are already expressible in SeqCraft today
    - that rf.use cannot currently be set, so a saturation pulse is emitted labelled 'excitation'
  does_not_establish:
    - that 110 deg / 8 ms is correct in any absolute sense; the independent design disagrees
    - that fat is suppressed in an image; no simulation or reconstruction was run
    - whether the offset-phase compensation matters; the references disagree and neither explains
    - anything about CEST saturation, regional saturation slabs or water excitation

validation:
  generic_measurements: []      # none run -- evidence phase
  family_checks: []
  metamorphic:
    - >
      PROPOSED and definable against R1 BEFORE the candidate exists: changing B0 scales the Hz
      offset proportionally and changes nothing else; changing the species ppm moves the offset
      and nothing else.
  parameter_sweep: not yet run
  emitted_inspection: []        # nothing emitted yet; rule B check is folded into the invariants
  layers:
    layer_1: NOT_APPLICABLE
    layer_2: NOT_APPLICABLE
    layer_3: NOT_APPLICABLE
    layer_3_reason: >
      Evidence phase.  Nothing has been implemented, so no layer has been exercised.  Layer 3 is
      available via MRzeroCore if review wants a suppression demonstration, but it would test a
      contrast outcome rather than the contract.
  compiler_changes: none proposed

status: NEW_LEAF
traffic_light: YELLOW
reason_code: REFERENCES_DISAGREE
decided_by: human               # PROPOSED by the skill; awaiting review
coverage: COMPOSITION_COVERED   # the pulse and the spoiler already compose; the gap is the label
                                # and the offset arithmetic -- findings.md sections 3 and 4

open_questions:
  - >
    THE YELLOW, narrowly: are flip angle, duration and bandwidth caller parameters rather than
    module-owned values?  Two independent designs disagree on all three, which is what a protocol
    parameter looks like -- but if bandwidth were derived from the offset instead, the module
    would own a value one reference treats as free.
  - >
    May the offset-induced phase compensation be omitted?  R2 applies it, R1 does not, neither
    explains, and behind a strong spoiler it is arguably irrelevant.  Judgement, not measurement.
  - >
    NEW_LEAF or EXTEND_EXISTING?  Letting Excitation state what its pulse is for would close the
    labelling gap with no new class and would fix it for every spectrally selective use, at the
    cost of leaving the caller to assemble pulse, offset arithmetic and spoiler each time.
  - Does OpenMRF's FAT/SAT library provide a third independent design?  Uninspected.
