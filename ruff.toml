# This baseline covers correctness, imports, library output, dead code, and exception hygiene.
# Broader rule families should be enabled in dedicated cleanup changes once the existing source
# satisfies them; selecting ALL made CI fail on hundreds of unrelated legacy-style findings.
line-length = 110

[lint]
select = ['E4', 'E7', 'E9', 'F', 'I', 'T20', 'ERA', 'TRY']

ignore = [
  'N',   # Uppercase/lowercase naming: required, since unit suffixes are _mT_m, _T_m_s, _Hz_per_m
  'PTH', # Path linting; os.path is fine here

  'RET504',  # Allow assignment before return (clearer for solved timing values)
  'Q000',    # Single quotes
  'PLR0913', # Any number of arguments
  'D212',    # Docstring may start on the next line
  'D100',    # No module-level docstring requirement conflict (we do write them)
  'D104',    # No __init__.py docstring requirement conflict (we do write them)
  'FBT002',  # Allow boolean defaults
  'W293',    # White space on blank lines
  'C901',    # Complexity
  'PLR0912', # Branch count
  'SIM108',  # Allow if..else over ternary
  'TRY300',  # A return inside a guarded rich repr keeps the fallback next to the happy path
  'COM812',  # Conflicts with the formatter
  'ISC001',  # Conflicts with the formatter
]

[lint.per-file-ignores]
'src/seqcraft/cli.py' = ['T201']              # the CLI is allowed to print
'src/seqcraft/display.py' = ['PLC0415']       # lazy matplotlib import is the whole point
'tests/**' = ['ANN', 'D', 'S101', 'PLR2004', 'T201', 'INP001', 'SLF001']
'examples/**' = ['ALL']

[format]
quote-style = 'single'

[lint.pydocstyle]
convention = 'numpy'
