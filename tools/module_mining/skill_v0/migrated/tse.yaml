# TSEShot + FSE2D, normalized into the Skill v0 artifact shape.
#
# The historical record is plans/tse/candidate.yaml and is UNCHANGED.  This is a second
# representation of the same evidence, not a correction of it.
#
# Provenance convention, on every field the schema requires:
#   [VERBATIM]      copied from the historical candidate.yaml
#   [RECONSTRUCTED] assembled from prose in the tse/ evidence set; the source is named
#   [NOT RECORDED]  the pilot did not capture this; stated as absent, never invented
#
#   python tools/module_mining/schema.py tools/module_mining/skill_v0/migrated/tse.yaml

id: tse-fse-shot                      # [VERBATIM]
name: TSEShot                         # [VERBATIM] -- working name; FSE2D shipped alongside

capability:
  summary: >                          # [VERBATIM]
    One excitation and its train of refocused Cartesian readouts: the crusher window shared by
    three axes, the echo spacing it implies, and the placement that keeps every echo at the
    midpoint between its two refocusing pulses.
  family: kernel                      # [VERBATIM]

target:
  layer: kernel + imaging             # [VERBATIM]
  paths:                              # [VERBATIM]
    - src/seqcraft/modules/kernel/tse_shot.py
    - src/seqcraft/modules/imaging/fse_2d.py
  composes:                           # [VERBATIM] from existing_seqcraft.reused
    - Excitation
    - Refocusing
    - PhaseEncode
    - CartesianLine
    - spoiler
  extended:                           # [VERBATIM] from target.extended
    - src/seqcraft/modules/readout/cartesian_line.py   # area_after_echo_per_m,
                                                       # echo_moment_imbalance_per_m
  untouched:                          # [VERBATIM]
    - Refocusing          # deliberately: the readout-axis lobe pair is sized by the readout
    - the compiler, LogicBlock, every other module
  not_created:                        # [RECONSTRUCTED] boundary_decision.md; the historical
                                      # record stated these as open_questions answered "no"
    - SE2D / HASTE classes -- echoes=1 is a conventional spin echo and a long train with
      partial_fourier below 1 is HASTE; the fine scan found no physics in either that the
      composition does not already express

reuse_rationale: >                    # [RECONSTRUCTED] boundary_decision.md section 2
  The split is by which layer has enough information to determine the value.  The shot owns the
  three-axis crusher window and the echo placement, because no leaf can see all three axes at
  once; the scan owns the table, the ordering and the dummy count, because those are policy.

