    commit: 0260f8a
    path: examples/fse_2d/01_build.ipynb
    license: MIT
    role: primary
    executable: executed              # [RECONSTRUCTED] validation.reference_executable R1: yes
    # promoted, stated throughout boundary_decision.md section 3
    independence: >                   # [RECONSTRUCTED] this is the implementation being
      The implementation under promotion.  Not an external witness at all -- agreement with it is
      the definition of the acceptance claim, not corroboration of it.
  - repo: imr-framework/pypulseq      # [VERBATIM]
    commit: f2c582b
    path: examples/scripts/write_tse.py
    license: MIT
    role: authoritative-external
    executable: executed              # [RECONSTRUCTED] validation.reference_executable R2: yes
    note: >                           # [VERBATIM]
      The fork used earlier (m-a-x-i-m-z/pypulseq-matlab-like@afcd4bb) is byte-identical to this
      file modulo the import name, so the earlier provenance caveat is closed and the earlier
      measurements stand unchanged.
    # "second Python witness to the same design", and the
    # protocol table shows R2 and R3 matching on every row that
    # is not matrix size
    independence: >                   # [RECONSTRUCTED] reference_inventory.md line 62 calls it a
      Shares a design with R3: identical refocusing duration, crusher fractions, ramp time, dummy
