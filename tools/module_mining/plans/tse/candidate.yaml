id: tse-fse-shot
name: TSEShot            # working name only; the boundary decision may reject the class entirely

capability:
  summary: >
    One excitation and its train of refocused Cartesian readouts: the crusher window shared by
    three axes, the echo spacing it implies, and the placement that keeps every echo at the
    midpoint between its two refocusing pulses.
  family: kernel

status: NEW_KERNEL + PROMOTE_NOTEBOOK   # decided by human review; boundary_decision.md
traffic_light: GREEN
# Superseded note (kept for the record): this read MORE_EVIDENCE_REQUIRED / YELLOW while
# the boundary was open.  The physics was settled and the boundary was not.  Cross-implementation comparison, the parameter
# sweep and the metamorphic tests have all run and all pass (comparison_report.md,
# sweep_report.md), so nothing here is blocked on another measurement.  What is missing is an API
# judgement -- see open_questions -- which the playbook reserves for human review.  Still not
# NEW_KERNEL: no extraction has been attempted.

target:
  layer: kernel + imaging
  paths:
    - src/seqcraft/modules/kernel/tse_shot.py       # TSEShot
    - src/seqcraft/modules/imaging/fse_2d.py        # FSE2D
  extended:
    - src/seqcraft/modules/readout/cartesian_line.py  # area_after_echo_per_m, echo_moment_imbalance_per_m
  untouched:
