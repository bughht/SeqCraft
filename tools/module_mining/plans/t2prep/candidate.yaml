# Mirrored from the workspace planning repository (docs/plans/module-mining/) on 2026-09-21.
# See ../../README.md for which copy to edit.
# T2Prep -- post-v0 Phase C, first fine scan.  The conventional-control candidate.
#
# REVISED 2026-09-22 after review.  The first pass held this at YELLOW partly because only one
# executable repository implemented it.  That was the wrong standard: reference coverage limits how
# strongly we can claim equivalence to a particular implementation, and does not decide whether a
# mature physical abstraction exists.  This revision adds a DOMAIN REFERENCE as a distinct
# evidence class and a second, permissively licensed implementation witness.
#
# REVISED 2026-09-23 after implementation review.  The composite 270/-360 tip-up had been carried
# from R3 into the mode contract as if it were part of what a T2 preparation IS.  It is not: it is
# R3's realisation of the tip-up, and R3 is the permissively licensed executable witness rather
# than the authority on the abstraction.  D1 gives the physical contract and describes the simple
# -90; E1 gives the canonical educational picture and agrees.  The contract now carries the
# four-part structure alone, the simple -90 is the default realisation, and the composite is a
# named alternative.  See the fine-scan playbook, "Realisation is not contract".
#
# Run with the merged v0 Skill, unmodified.  Evidence -> contract -> ownership -> acceptance
# claim, and it stops there: nothing was implemented.
#
#   python tools/module_mining/schema.py tools/module_mining/plans/t2prep/candidate.yaml

id: t2-preparation
name: T2Prep

capability:
  family: preparation
  summary: >
    A T2-weighting preparation period.  Magnetisation is tipped into the transverse plane, held
    there for a defined time during which static dephasing is refocused by a train of refocusing
    pulses, tipped back to +z, and whatever transverse magnetisation remains is crushed.  The
    longitudinal magnetisation that survives is weighted by exp(-tau / T2) rather than by
    exp(-tau / T2*), and that distinction IS the module.
  what_a_user_could_get_wrong: >
    Four things, each of which produces a legal sequence and a plausible image.
    (1) The tip-up phase relative to the tip-down.  Wrong sign and the second pulse continues the
    rotation instead of reversing it, so the prepared magnetisation is destroyed rather than
    stored -- the same class of load-bearing sign as SaturationPrep's frequency offset.
    (2) The interval symmetry.  If the gaps around each refocusing pulse are not equal, the echoes
    do not coincide with the pulse centres, static dephasing is NOT refocused, and the result is
    T2*-weighted while still looking like a T2 preparation.
    (3) The refocusing phase alternation.  Every witnessed design cycles the composite pulses'
    phase; with a single phase, B1 error accumulates instead of cancelling.
    (4) The crusher placement.  It must follow the tip-up.  Before it, it destroys the
    magnetisation the preparation exists to store.

target:
  layer: preparation
  seat: >
    modules/preparation/, whose folder contract is `rf.use in {inversion, saturation,
    preparation}`.  IRPrep and SaturationPrep hold the first two seats; this is a candidate for
    the third, and the folder docstring already names it.
  untouched:
    - src/seqcraft/compiler        # no compiler change is implied or needed
    - src/seqcraft/design          # no LogicBlock change
    - src/seqcraft/modules/rf      # see ownership.refocusing_train -- Refocusing is NOT reused
    - src/seqcraft/modules/kernel  # there is no cross-leaf coupling here
    - src/seqcraft/modules/imaging

evidence:
  - id: R1
    source: openmrf
    repo: OpenMRF/openmrf-core-matlab
    path: include_pulseq_toolbox/src_preparations/T2/
    commit: fd03604
    license: MIT
    role: independent-implementation
    language: matlab
    executable: documentary
    independence: >
      Independent of the Pulseq line -- OpenMRF is developed separately, and the registry records
      it as a genuine second witness where it overlaps.  Here there is nothing to be second to --
      see reference_situation.
    what_it_establishes: >
      The structure, and four quantitative facts.  The refocusing train is TWO composite pulses.
      The inter-pulse interval is (prep_time - 2 * rfc_dur) / 4, used four times, which places the
      pulses at one quarter and three quarters of the preparation period -- so the spacing is
      symmetric about each pulse and the two echoes coincide with them.  The two composites carry
      OPPOSITE phase, ref_phase + pi/2 and ref_phase - pi/2.  The composite itself is a constant-
      amplitude block pulse whose phase is -y for the first quarter, +x for the middle half and -y
      for the last quarter -- the classic 90(-y) 180(+x) 90(-y).
    what_it_does_not_establish: >
      Any agreement with a second independent implementation, because there is none in the
      registered corpora.  Nor the correctness of its own conventions -- notably that prep_time is
      measured tip-down-END to tip-up-START rather than centre to centre, which for an adiabatic
      BIR-4 of 2 to 5 ms is a 5 to 25 percent difference against a 40 ms preparation.
  - id: R2
    source: openmrf
    repo: OpenMRF/openmrf-core-matlab
    path: include_pulseq_toolbox/src_preparations/MLEV/
    commit: fd03604
    license: MIT
    role: architecture-evidence
    independence: >
      NOT an independent witness.  Same corpus, same author, and it shares the crusher helper
      (CRUSH_x_y_z) and the composite-pulse concept with R1.  It is cited as evidence about the
      ABSTRACTION's variability, not as corroboration of R1's numbers.
    what_it_establishes: >
      That the outer boundary is stable and the inner train is not.  R2 has the same tip-down,
      tip-up and crusher as R1, and differs in the train -- n_mlev groups of four composites with
      an explicit +1/-1 cycling list, minimal gaps between them.
      **The parameterisations are opposite.**  In R1 the preparation duration is an INPUT and the
      interval spacing is solved from it.  In R2 the train is specified -- a count and a composite
      duration tau = 1 / fSL -- and the duration FALLS OUT as n_composite * tau.
    why_it_matters: >
      Two designs of one physical contract, by one author, disagreeing about which variable is
      fixed.  That is the mode-contract question stated by the evidence rather than by us, and it
      is the reason this record does not reach APPROVED_FOR_IMPLEMENTATION.
  - id: D1
    source: domain-reference
    repo: n/a -- a book, not a repository; see `citation` and `curated_card`
    license: >
      Copyrighted textbook.  CITED ONLY.  No text is reproduced beyond short quotations for
      provenance, and the PDF is deliberately not in the repository.
    citation: >
      Bernstein, M. A., King, K. F., Zhou, X. J.  Handbook of MRI Pulse Sequences.  Elsevier,
      2004.  Chapter 17 "Advanced Pulse Sequence Techniques", section 17.4 "Driven Equilibrium"
      (K. F. King), book pages 888-895; subsection 17.4.2 "Gradient-Echo-Driven Equilibrium
      Preparation", pages 893-895.
    role: authoritative-external
    evidence_class: domain-reference
    independence: >
      Not an implementation and not derived from any corpus here.  It is the authority for the
      FAMILY and its semantics; it corroborates no particular realisation, which is what the
      implementation witnesses are for.
    curated_card: tools/module_mining/domain_evidence/t2prep.md
    what_it_establishes: >
      That this is a canonical, named MRI family -- the Handbook's own term is driven equilibrium,
      and it says "this use of driven equilibrium is also called T2 preparation (T2-prep)".  The
      base structure is a NONSELECTIVE 90x-tau-180y-tau-90(-x).  The semantic quantity is a single
      preparation time- "the duration of the preparation sequence Tprep determines the amount of
      T2 weighting", and the surviving longitudinal magnetisation is Mz * exp(-Tprep/T2).  A
      longer Tprep is canonically reached by "using multiple 180 degree pulses", so the refocusing
      train SERVES the preparation time.  Composite pulses are a named, optional robustness choice
      "to decrease sensitivity to B0 and B1 inhomogeneity".  The spoiler follows the tip-up, on
      "one or more axes".  And k-space ordering -- centric or elliptical-centric -- is named as
      DOWNSTREAM acquisition policy, outside the preparation.
    what_it_does_not_establish: >
      The refocusing count, any spoiler moment, whether the tip-up is a simple -90 or a composite,
      or the bookkeeping of Tprep against real pulse durations.  Its physics is stated for ideal
      instantaneous pulses, where "the time between the DE 90 degree pulses" is unambiguous.
      Those are precisely the questions the mode contract must fix.
  - id: E1
    source: mriquestions
    repo: n/a -- a teaching website, not a repository; see `citation`
    license: >
      Copyrighted educational material.  CITED ONLY.  Registered in sources.yaml with roles
      [educational-synthesis] and explicitly_not [design-witness, oracle].
    citation: >
      Elster, A. D.  "Driven Equilibrium", MRIquestions / Questions and Answers in MRI.
      https://mriquestions.com/driven-equilibrium.html
    role: educational-synthesis
    evidence_class: educational-synthesis
    independence: >
      Not an implementation and not a primary source.  It is a curated synthesis of the standard
      account, and its value is that it shows what the FIELD teaches as the canonical form rather
      than what any one design happens to build.
    what_it_establishes: >
      That the canonical picture taught for a T2 preparation is 90x -- refocusing -- -90x --
      spoil, with the tip-up as the tip-down undone.  It corroborates D1 on the base structure
      and on composite or adiabatic pulses being an optional robustness choice rather than part
      of the definition.
    what_it_does_not_establish: >
      Anything that could overrule D1 or a measurement.  Its registered role is explicit- an
      educational synthesis must not override stronger domain evidence, and it is not a
      design-witness and not an oracle.  It is cited here because it is the second independent
      statement that the SIMPLE tip-up is the canonical form, which is what makes the composite a
      realisation rather than the contract.
  - id: R3
    source: ptb-mrseq
    repo: PTB-MR/mrseq
    path: src/mrseq/preparations/t2_prep.py
    commit: df03749
    license: Apache-2.0
    role: independent-implementation
    language: python
    executable: yes
    independence: >
      Independent OF OPENMRF, which is the comparison that matters here- different institution
      (PTB), language, structure and realisation of the same family.  Built on PyPulseq, so NOT
      independent of the Pulseq line for low-level event construction -- irrelevant to this
      candidate, because no Pulseq-line source implements a T2 preparation at all.
    what_it_establishes: >
      A non-adiabatic MLEV-4 realisation, and therefore a witness for the variant SeqCraft can
      actually build.  Hard block pulses throughout.  Four composite refocusing pulses, each
      itself a 90x-180y-90x, with the + + - - MLEV-4 phase pattern.  A composite 270x / -360x
      tip-up.  An optional single-axis z spoiler, documented as not affecting the echo time.  Its
      public parameter is `echo_time`, defined as CENTRE of the excitation to CENTRE of the 270
      tip-up, and it refuses an echo time too short for the requested pulse duration.
      Cited to Levitt & Freeman (1981) for the composite pulse and Brittain et al. (1995) for the
      application -- the same Brittain reference the Handbook names for cardiac blood-myocardial
      contrast.
    measured_by_us: >
      Executed at seven protocols spanning echo times of 30 to 100 ms and 180-pulse durations of
      1 and 2 ms.  The realised echo time equals the requested one to 0.00 us, and the four
      refocusing points land at 0.1250, 0.3750, 0.6250 and 0.8750 of it -- the MLEV-4 symmetric
      condition, exact.  15 RF pulses- one excitation, four composites of three, and a two-pulse
      composite tip-up.
    what_it_does_not_establish: >
      Any physical consequence.  Its own tests assert block-duration arithmetic and the
      short-echo-time refusal; they do not check that the realised echo time matches the request,
      the phase pattern, or the T2 weighting.  We measured the first two; the third needs an
      oracle.
  - id: N1
    source: pypulseq
    repo: imr-framework/pypulseq
    path: pypulseq/make_adiabatic_pulse.py
    commit: f2c582b
    license: MIT
    role: architecture-evidence
    independence: >
      Not a witness of this family at all, and cited for what it LACKS.  Independence is
      therefore not the relevant axis: this is a capability check on the RF factory SeqCraft
      already depends on, and IRPrep is the consumer that proves the adiabatic path works for
      inversions.
    what_it_establishes: >
      A NEGATIVE result, and the blocking one when it was written -- R3 later discharged it.
      Both OpenMRF designs tip down and tip up with an adiabatic 90 -- BIR-4 or AHP -- and
      pypulseq's make_adiabatic_pulse is documented "Make an adiabatic inversion pulse" and offers
      only hypsec and wurst.  Those invert; they cannot perform a 90 degree rotation.  So SeqCraft
      can build an adiabatic INVERSION, as IRPrep already does, and cannot build the adiabatic
      ROTATION those two designs use.
    measured: >
      Verified rather than assumed, and the first guess was wrong -- IRPrep already routes hypsec
      and wurst to make_adiabatic_pulse, so adiabatic support exists.  What is absent is
      specifically the 90-degree adiabatic family.

reference_situation:
  independent_witnesses: 2       # R1 and R3.  R2 is the same corpus and author as R1
  designs_examined: 3            # OpenMRF T2/ and MLEV/, and `mrseq`
  note: >
    Searched all nine registered corpora for T2-preparation evidence.  pypulseq, pulseq-matlab,
    pulseq-cest, PulseqDiffusion and Open4DFlow have none.  The MRzero playground appeared to
    match on "MLEV" and did not -- the hits were case-insensitive fragments of base64 image data,
    checked and discarded.  The first pass therefore found the family witnessed by OpenMRF alone;
    the 2026-09-22 revision added R3 (PTB-MR/mrseq, Apache-2.0), which is independent of OpenMRF
    and is the witness for the non-adiabatic variant SeqCraft can build.
  oracle_available: >
    Yes in principle -- MRzeroCore can simulate a T2 preparation and the exp(-tau/T2) weighting is
    exactly the kind of claim a Bloch simulation settles.  Not used at this stage, because Layer 3
    is not what is blocking.

contract:
  invariants:
    - >
      Magnetisation is transverse for the declared preparation time and longitudinal outside it.
    - >
      Static dephasing accumulated in the first half of each inter-pulse interval is reversed in
      the second half, so the refocusing condition is that the gaps either side of every
      refocusing pulse are equal.
    - >
      The tip-up reverses the tip-down -- same axis, reversed sense -- so that surviving
      magnetisation is returned to +z rather than advanced further.
    - >
      Residual transverse magnetisation after the tip-up is destroyed before the imaging train
      begins, and the crusher that does it lies entirely outside the preparation period.
  semantic_timing:
    public_quantity: prep_time_s
    definition: >
      The interval during which the magnetisation this module prepares is transverse, measured
      between two plain RF centres- the centre of the +90 tip-down, and the centre of the tip-up
      pulse that ends the period.  Which pulse that is depends on the tip-up REALISATION, and both
      choices are ordinary pulse centres rather than derived or weighted instants-
        tip_up='simple'             the centre of the -90.  The default.
        tip_up='composite_270_360'  the centre of the 270, which is R3's own convention for its
                                    own realisation and which R3 realises to 0.00 us.
      REVISED 2026-09-23.  The earlier wording said "effective rotation instant", which invited an
      amplitude-weighted rule for asymmetric composites.  That rule was introduced during
      implementation and has now been REMOVED- it is not established by D1, not established by R3
      (which books the 270's centre), and a Layer 3 slope fit cannot adjudicate it because a
      constant offset does not change a slope.  An interval between two pulse centres is
      measurable on a compiled file, which is what a public quantity has to be.
    why_not_block_edges: >
      Because the physics is about the transverse period, not about block boundaries.  The
      Handbook states the weighting as exp(-Tprep/T2) for "the time between the DE 90 degree
      pulses" (p. 893), which for ideal instantaneous pulses is unambiguous and for real pulses is
      bounded by the effective rotation instants.  OpenMRF books the same interval edge-to-edge
      (tip-down end to tip-up start); `mrseq` books it centre-to-centre.  **Those are two
      bookkeepings of one physical interval, not a disagreement about physics** -- they differ by
      one tip-pulse duration, which is 2 to 10 ms against a 40 to 100 ms preparation, so the
      choice is load-bearing even though the physics is not in dispute.  SeqCraft takes the
      semantic definition and does not inherit either implementation's block arithmetic.
    future_modes: >
      An adiabatic BIR-4 or AHP tip pair does NOT rotate at its pulse centre, so an adiabatic mode
      must define its own effective-rotation instant rather than reuse the centre-to-centre
      reduction.  Recorded so that adding the mode cannot silently change what prep_time_s means.
  determinable_from_own_parameters:
    - the number of refocusing pulses and their placement, given the preparation time
    - the four interval durations, given the preparation time and the pulse durations
    - the phase of every pulse relative to a single reference phase
    - the crusher moments, given a voxel size
    - the total block duration
  caller_policy:
    - the preparation time, or the refocusing count -- see open_questions
    - the RF pulse family, and therefore the B1 robustness
    - where the preparation sits relative to the imaging train
    - how many preparation times a protocol plays, and in what order

ownership:
  refocusing_train: >
    **Intrinsic to the leaf.**  Every witnessed design keeps the train entirely inside the
    preparation and never exposes it; the count and spacing are determined by the preparation time and the leaf's
    own pulse durations, and nothing outside the preparation influences either.  That is the v0
    ownership test answered in the affirmative.
  why_refocusing_is_not_reused: >
    Measured, not assumed.  `Refocusing` refuses crush_cycles_per_voxel=0 -- "must be positive" --
    so it cannot emit a crusher-free pulse, and a crusher inside a T2 preparation destroys the
    magnetisation being stored.  It is also built to be slice-selective with a balanced crusher
    pair, which is the opposite job.  So this is a case of reuse of SEMANTICS -- a 180 that
    reverses phase -- without reuse of the emitted event, which is the corollary v0 states.
  tip_pulses: >
    Intrinsic.  A tip-down whose partner tip-up must reverse it is a pair, and a caller handed
    two independent Excitation calls is the failure mode in capability.what_a_user_could_get_wrong.
  crusher: >
    Intrinsic, by the IRPrep and SaturationPrep precedent -- both own their own spoiler.
  input_magnetisation: >
    **Not the leaf's, and the domain reference is explicit about it.**  The weighting is
    Mz * exp(-Tprep/T2) where Mz is the longitudinal magnetisation before the first 90, and the
    Handbook says it "must be calculated by taking into account steady-state conditions -- it is
    not simply the equilibrium longitudinal magnetisation" (p. 893).  So the leaf owns the
    exponential factor it applies and cannot know the quantity it multiplies.  That is a clean
    ownership statement rather than a gap- the module's claim is about the factor.
  downstream_acquisition: >
    Explicitly NOT the leaf's.  The Handbook names centric or elliptical-centric k-space ordering
    as the canonical mitigation for T1 regrowth during the imaging period (p. 893) -- acquisition
    policy, owned by whatever follows.  The same page names the composability that makes this a
    leaf rather than a kernel- T2prep is used with FLASH/GRE, with bSSFP, and alongside fat
    saturation and adiabatic inversion (p. 895).
  a_variant_that_crosses_the_boundary: >
    **Recorded because it is the one real boundary complication in the family.**  The Handbook's
    B1-robust variant (pp. 893-894, Figure 17.36) puts a dephasing lobe G1 after the first 90 --
    inside the preparation -- and a matching rephasing lobe G2 "after each RF pulse in the
    subsequent imaging sequence", noting that "in practice G2 is combined with the
    slice-selection rephaser gradient lobe".  So its correctness condition spans the
    preparation/readout boundary and no single module can hold it.
    It is therefore NOT in the initial mode.  If it is ever wanted it is a cross-leaf coupling and
    belongs to a kernel, which is exactly the layer the ownership table reserves for couplings no
    leaf can see.  Cross-referenced to C3, which is about requirements that span modules.
  kernel_involvement: none for the initial mode; see a_variant_that_crosses_the_boundary
  compiler_involvement: none

# Rule A.  One mode now, deliberately, with the differential to the deferred ones written down so
# that adding them cannot quietly change the first one's meaning.
mode_contract:
  public_target: prep_time_s   # see contract.semantic_timing
  modes:
    - id: mlev4-hard
      status: INITIAL, and the only one
      rf_family: hard block pulses throughout, non-adiabatic
      tip_down: 90 about +x
      refocusing_train: >
        Four composite refocusing pulses, each a 90x-180y-90x block composite, at 1/8, 3/8, 5/8
        and 7/8 of prep_time_s, with the MLEV-4 phase pattern + + - -.
      tip_up: >
        A REALISATION, not an invariant, and therefore a named parameter.
          'simple'             a single hard -90.  THE DEFAULT- it is what D1 describes and what
                               E1 teaches as canonical, it is the tip-down undone, and it is the
                               shortest, so it pays the least relaxation and RF energy.
          'composite_270_360'  270 about +x then 360 about -x, net -90.  R3's realisation,
                               offered because it is established, not because it is measured to
                               be better.
        Deliberately not a boolean, because the choice moves prep_time_s's second endpoint; and
        deliberately not named `robust`, `b1_robust` or `cardiac`, because no quantitative
        robustness claim is made for either.  A future adiabatic family is NOT a third value-
        an adiabatic pulse does not rotate at its centre, so it changes what prep_time_s MEANS,
        which belongs to a pulse-family choice rather than to this parameter.
      selection_gradient: none.  The family is nonselective (Handbook p. 888)
      intrinsic_rephasing: not applicable -- no selection gradient to rephase
      encoding_role: none.  It imposes no phase intended to be sampled
      adc_semantics: none.  A preparation contains no ADC
      timing_consequence: >
        prep_time_s is realised exactly at the semantic definition; the block is longer than
        prep_time_s by the half tip-pulses, the dead and ringdown times and the spoiler.
      spoiler: after the tip-up, outside prep_time_s, one or more axes
      reference_evidence: >
        R3 (`mrseq`, Apache-2.0) implements this mode and we measured it.  D1 establishes the
        family, the nonselectivity, the composite-pulse rationale and the spoiler placement.  R2
        (OpenMRF MLEV) uses the same + + - - pattern in groups of four.
      user_overridable: prep_time_s, tip_up, the 180 duration, the spoiler moment and axes
  differentials:
    - from: mlev4-hard
      to: mlev2-hard
      changes: two composite refocusing pulses instead of four, at 1/4 and 3/4
      must_remain_invariant: >
        prep_time_s semantics, nonselectivity, the tip pair being inverses, phase alternation
        between consecutive refocusing pulses, and the spoiler lying outside prep_time_s.
      why_deferred: >
        OpenMRF's T2/ uses two and its MLEV/ uses multiples of four; the Handbook says only
        "multiple 180 degree pulses".  MLEV-4 is chosen because it is the one a permissively
        licensed witness implements AND the one whose phase pattern both OpenMRF modules use.
        A count parameter is NOT exposed- see evidence_state.
    - from: mlev4-hard
      to: mlev4-adiabatic
      changes: >
        BIR-4 or AHP tip pair instead of hard 90 and composite 270/-360.  **And the semantic
        timing reduction changes** -- an adiabatic pulse does not rotate at its centre.
      must_remain_invariant: >
        prep_time_s as the effective-rotation-to-effective-rotation interval, the train, the
        phase pattern, and the spoiler.
      why_deferred: >
        pypulseq offers adiabatic INVERSION only (hypsec, wurst) -- see N1 -- so the pulse family
        does not exist to build.  **This mode is where the B1-robustness claim lives**, and the
        initial mode therefore makes no such claim.
    - from: mlev4-hard
      to: b1-robust-with-g1-g2
      changes: a dephasing lobe inside the preparation and a rephasing lobe inside the READOUT
      must_remain_invariant: everything about prep_time_s
      why_deferred: >
        Its correctness condition spans two modules, so it is not a leaf mode at all -- see
        ownership.a_variant_that_crosses_the_boundary.
    - from: mlev4-hard
      to: diffusion-prep
      changes: gradient lobes between the tip-down and the first refocusing pulse
      must_remain_invariant: the tip pair, the tip-up, the spoiler
      why_deferred: >
        The Handbook notes (p. 895) that this same block with gradients between the 90 and the 180
        IS a diffusion preparation.  That is a different physical claim -- b-value rather than T2
        weighting -- and it belongs with C3 and the later diffusion candidate, not here.

acceptance:
  defined_before_extraction: true   # nothing has been extracted; the mode contract came first
  claim_scope: >
    Scoped to `mlev4-hard`, the only mode.  Every item below is measurable without a scanner, and
    the Layer 3 item is the one that makes the module worth having.
  establishes:
    - >
      Interval symmetry on the emitted lattice -- the gaps either side of each refocusing pulse,
      measured from the emitted events' own knots, equal to within one raster.  Rule E.
    - >
      The declared preparation time equals the measured **effective tip-down rotation instant to
      effective tip-up rotation instant** interval, which for this mode's hard and composite
      pulses is RF centre to RF centre.  RECONCILED 2026-09-23: this bullet previously said
      "tip-down-end to tip-up-start", which is OpenMRF's edge-to-edge bookkeeping and contradicts
      contract.semantic_timing.definition and the decision summary.  The two differ by one
      tip-pulse duration, so the disagreement was load-bearing rather than cosmetic.
    - >
      Phase alternation between consecutive refocusing pulses, read off the compiled file.
    - >
      Zero net gradient area across the preparation period, and the crusher moment entirely
      outside it.
    - >
      Metamorphic -- doubling the preparation time doubles the measured transverse interval and
      leaves the pulse count, the phases and the crusher unchanged.
  does_not_establish:
    - >
      exp(-tau/T2) weighting.  That is a Layer 3 claim needing a simulator, and it is the claim a
      user actually cares about.
    - >
      B1 or B0 robustness.  The OpenMRF adiabatic variants target that separately named physical
      problem; the shipped hard-pulse mode makes no quantitative robustness claim, and neither
      tip-up realisation adds one.
    - >
      Agreement with any second independent implementation.

validation:
  # IMPLEMENTED 2026-09-23.  The scan's acceptance claim is now an implementation's evidence.
  layers:
    layer_1: GREEN            # 60 tests in tests/modules/test_t2_prep.py, every claim measured on
                              # the emitted events or on the compiled sequence, and BOTH tip-up
                              # realisations asserted rather than the default trusted for both
    layer_2: GREEN            # examples/t2prep_gre_2d/01_build.ipynb -- the preparation in front
                              # of a shipped GRE2D, centrically ordered, .seq files in both
                              # realisations
    layer_3: GREEN            # examples/t2prep_gre_2d/02_simulate_and_reconstruct.ipynb
    layer_3_result: >
      A known T2 is recovered from the slope of ln S against prep_time_s to within 1 % from 40 to
      250 ms, with nothing fitted but the slope.  The control is the decisive one- T2* was swept
      from 80 ms to 16 ms, a factor of five, and the fitted value moved by 3 %.  So the
      preparation weights by the tissue's T2 and not by the magnet's contribution to T2*, which is
      the claim the module exists to make.  The residual bias is ONE-SIDED and is T1- +2 % at a
      500 ms T1, 0.1 % at 20 s, because longitudinal magnetisation recovers during the
      preparation.  That is a property of the sequence rather than of the implementation, and it
      is why this is a contrast preparation and not a T2 mapping method.
    layer_3_realisation_sweep: >
      NON-BLOCKING, and a measurement rather than a claim.  B1 was scaled from 0.8 to 1.2 and
      off-resonance swept to 200 Hz across BOTH realisations, with T2 = 80 ms.

        B1     simple     composite_270_360
        0.8     81.2 ms      67.2 ms
        0.9     28.7 ms      31.5 ms
        1.0     80.4 ms      80.8 ms
        1.1    206.4 ms     209.6 ms
        1.2   2047.6 ms    3052.6 ms

      WHAT IT ESTABLISHES- no consistent B1-robustness advantage was observed for
      composite_270_360.  Both realisations become unreliable away from nominal B1, their errors
      are NOT identical, and at B1 = 0.8 the composite is notably the worse of the two.  The
      columns are not monotonic, so they are three-point fits of a preparation that is failing
      rather than measurements of anything.  Over this particular B0 sweep the two behave
      similarly, which is a similarity and not a quantitative B0-robustness claim for either.
      WHAT IT DOES NOT ESTABLISH- which part of the preparation dominates B1 sensitivity.  The two
      tip-ups are equivalent as ideal rotations under a multiplicative B1 error, but the emitted
      sequence is finite-duration -- relaxation during the pulses, dead and ringdown intervals,
      off-resonance evolution in the gaps -- so the longer realisation need not behave identically,
      and here it does not.  No ablation was run and none is needed to ship the module.
      WHY IT IS RECORDED- it is sufficient for the one conclusion that matters here- the composite
      realisation MUST NOT be presented as a robustness feature.  Had it been promoted into the
      contract as one, the measurement would not have backed it.
    layer_3_instrument_note: >
      The sweep needed a different instrument, and the notebook shows why before it uses it.
      MRzeroCore's phase-distribution graph runs a pre-pass that decides which coherence pathways
      to simulate from the NOMINAL flip angles; a 360 is the identity only at nominal B1, so off
      nominal the graph prunes exactly the pathways the sweep is about.  It is wrong for the
      simple realisation too (+49 % at B1 = 0.8) and worst for the composite (-73 %).  The sweep
      uses mr0.isochromat_sim, MRzero's documented ground truth, for both.  Sections 1 to 4 run at
      nominal B1 where the two instruments agree to 2 %, and keep the fast path.
    layer_3_reason_when_scanned: >
      Not deferred for want of an oracle -- MRzeroCore can simulate a T2 preparation, the
      exp(-tau/T2) weighting is exactly what a Bloch simulation settles, and the shared BrainWeb
      phantom carries T2 and T2' separately.  NOT_APPLICABLE because there is nothing to validate --
      this fine scan stops at the acceptance claim and no module was written.  The moment one is,
      Layer 3 is both available and the most valuable layer for this candidate, since the claim a
      user cares about is the weighting itself.
  planned_if_approved: >
    Layer 1 from the invariants in acceptance_claim.would_establish, all measured on the emitted
    lattice.  Layer 2 as a complete acquisition -- a preparation followed by a real imaging train,
    since a preparation alone is not an acquisition.  Layer 3 against MRzeroCore, comparing
    recovered signal against exp(-tau/T2) over a spread of preparation times, which is the claim
    that makes the module worth having and is cheap here because the phantom carries T2 and T2'
    separately.

coverage_classification: null   # no existing SeqCraft abstraction covers this family

status: NEW_LEAF
traffic_light: GREEN          # IMPLEMENTED 2026-09-23; was APPROVED_FOR_IMPLEMENTATION

implementation:
  shipped: src/seqcraft/modules/preparation/t2_prep.py
  mode: mlev4-hard, and only that -- every deferred mode in mode_contract.differentials is still
    deferred, and none of them was added to make the first one fit.
  spec_consistency_pass: >
    RECONCILED before any code was written.  acceptance.establishes carried the older
    "tip-down-end to tip-up-start" wording, which is OpenMRF's edge-to-edge bookkeeping and
    contradicts contract.semantic_timing.definition and the decision summary.  The two differ by
    one tip-pulse duration, so the disagreement was load-bearing.  The record was made
    self-consistent on the semantic definition first, and the test encodes that.
  realisation_correction: >
    REVISED 2026-09-23, and this is the substantive change to the record.
    The first implementation carried R3's composite 270/-360 tip-up as the mode's only form, and
    then, because that composite is ASYMMETRIC and has no obvious single rotation instant,
    introduced an amplitude-weighted-centre rule to say where prep_time_s ended.  Both were
    mistakes of the same kind- a special realisation from one corpus implementation promoted into
    the reusable physical contract because it was the permissively licensed executable witness.
    The implementation corpus tells us "someone implemented it this way"; domain evidence tells us
    "this is what the abstraction actually requires".  D1 and E1 describe the simple -90.
    What changed.  The default realisation is now the canonical +90 -> MLEV-4 -> -90 -> spoiler,
    with prep_time_s from the +90's centre to the -90's centre.  The composite is available as
    tip_up='composite_270_360', with prep_time_s from the +90's centre to the 270's centre --
    R3's own convention for R3's own realisation, adopted rather than replaced by a rule of ours.
    The amplitude-weighted-centre rule is REMOVED: it is established by neither the domain
    evidence nor the witness, and Layer 3 slope fitting cannot adjudicate it because a constant
    offset does not change a slope.
    The durable lesson is recorded in the fine-scan playbook as "Realisation is not contract", not
    as a rule local to this candidate, and sources.yaml gained an `educational-synthesis` role so
    that a canonical teaching account can be cited without it being able to overrule a domain
    reference.
  one_thing_the_record_did_not_decide: >
    Whether every pulse in the block really shares one B1 for a `refocus_duration_s` that is not a
    convenient number.  At one amplitude a flip angle IS a duration, so 90 : 180 : 270 : 360 must
    be exactly 1 : 2 : 3 : 4 and each must land on the RF raster -- which rounding each pulse
    separately does not give.  The implementation rounds the BASE 90 onto the raster and reports
    the 180 it realised, so the single amplitude is exact for any request.  Recorded because the
    "one B1" claim is public, and a public claim that holds only for default numbers is a defect
    rather than a simplification.

decision_summary: >
  A T2 preparation is a self-contained preparation leaf, and the boundary is settled by domain
  evidence rather than by counting repositories.  The Handbook names the family, gives its
  nonselective 90-180-90 structure, states the weighting as exp(-Tprep/T2), makes the refocusing
  train the canonical way to lengthen Tprep, names composite pulses as an optional robustness
  choice, puts the spoiler after the tip-up, and puts k-space ordering outside the preparation.
  Two implementations in different languages from different institutions realise that structure,
  and the leaf owns exactly what the ownership test says it should.

  The first pass held this at YELLOW largely because one repository implemented it.  That was the
  wrong standard, and correcting it is the substance of this revision: reference coverage limits
  how strongly we may claim equivalence to a particular implementation, and does not decide
  whether a mature abstraction exists.

  The two questions that actually blocked are now answered.
  (1) The public quantity is `prep_time_s`, defined semantically as effective-tip-down-rotation to
  effective-tip-up-rotation, which for hard and composite pulses reduces to centre to centre.  The
  two implementations' differing bookkeeping is two accounts of one interval, not a physical
  disagreement, and SeqCraft takes the semantic definition rather than either one's block
  arithmetic.  `mrseq` realises it to 0.00 us, measured.
  (2) The initial realisation is non-adiabatic MLEV-4, which `mrseq` witnesses directly under
  Apache-2.0 -- so the buildable variant is witnessed after all, which is what the first pass
  said it needed.

  **The B1-robustness claim is explicitly excluded from this mode.**  It is the reason the
  adiabatic variants exist, pypulseq cannot build them, and the mode differential records that
  adding one also changes the timing reduction.  The composite pulses in the initial mode do buy
  some B0 and B1 insensitivity -- the Handbook says so -- and no quantitative claim is made about
  it.

  Implementation is justified for `mlev4-hard` only.

open_questions:
  - >
    RESOLVED 2026-09-23, by decision rather than by measurement.  The question was whether the
    composite tip-up's effective rotation instant is the centre of its 270 or somewhere inside the
    270/-360 pair.  Layer 3 cannot answer it -- a constant offset does not change a fitted slope --
    so it was never going to be settled by simulation.  It is answered by ownership instead- the
    composite is R3's realisation, so prep_time_s under it takes R3's convention, the centre of the
    270.  The default realisation has no composite tip-up and so has no such question.
  - >
    Should the spoiler be one axis or three?  D1 says "one or more axes", `mrseq` uses z alone,
    OpenMRF uses all three with each derated to 1/sqrt(3).  The initial mode follows `mrseq` and
    exposes the axes, which makes this a caller choice rather than an open question -- recorded
    because the three-axis derating policy is evidence for a separate open item.
  - >
    Does the three-axis crusher derating policy belong to this candidate or to `spoiler`?  Both
    OpenMRF preparations derate each axis to 1/sqrt(3) of the nominal gradient AND slew limit and
    stagger the ramps, citing peripheral nerve stimulation for the slew part.  This is the same
    question Phase A left open for SpiralReadout's dephaser, and this corpus has a deliberate
    answer to it.  Cross-referenced, not decided here.

evidence_state:
  human_review: DONE            # boundary, semantic timing and the initial mode reviewed
  experiment_design_review: DONE
  scanner_validation: NOT_REQUIRED_FOR_CLAIM
  note: >
    Not required because the claim is the exp(-prep_time/T2) factor, and a Bloch simulation
    against a phantom carrying T2 and T2' separately is more direct evidence for that than an
    image would be.  A scanner becomes relevant only for the B1-robustness claim, which this mode
    does not make.
  resolved:
    - what: Which parameterisation is the leaf's public quantity.
      was_deferred_because: >
        Two OpenMRF designs parameterise oppositely -- duration in with spacing derived, against
        train in with duration derived.
      how_it_was_discharged: >
        Domain evidence settled it, not a vote between implementations.  The Handbook's semantic
        quantity is Tprep, and it makes the refocusing train the means of lengthening Tprep rather
        than an independent input.  So prep_time_s is the public target and the train is a
        realisation choice.  `mrseq` independently agrees- its public parameter is echo_time and
        its train is fixed at MLEV-4.  OpenMRF's MLEV module, which parameterises by train, is a
        consumer computing its argument for a fingerprinting schedule -- a consumer-specific use,
        not the canonical standalone definition.
    - what: A witness for the variant SeqCraft can actually build.
      was_deferred_because: >
        Both OpenMRF designs tip with an adiabatic 90 and pypulseq offers adiabatic inversion
        only, so the non-adiabatic variant was witnessed by nothing.
      how_it_was_discharged: >
        PTB-MR/mrseq, Apache-2.0, implements a non-adiabatic MLEV-4 T2 preparation with hard block
        pulses, cited to Levitt & Freeman (1981) and Brittain et al. (1995).  Executed at seven
        protocols- realised echo time exact to 0.00 us, refocusing points at 0.1250, 0.3750,
        0.6250 and 0.8750 of it.
  deferred:
    - what: Adiabatic BIR-4 / AHP tip pair, as a second mode.
      why: >
        **This is where the B1-robustness claim lives**, and the initial mode makes none.
        pypulseq's make_adiabatic_pulse is documented for inversion and offers hypsec and wurst,
        neither of which rotates by 90; OpenMRF generates BIR-4 through SigPy.
      revisit_trigger: >
        A 90-degree adiabatic family becomes available in pypulseq or SeqCraft, OR a claim is made
        that needs B1 robustness.  Adding it must also define the mode's own effective-rotation
        instant -- see contract.semantic_timing.future_modes.
    - what: A refocusing-count parameter, or an arbitrary train length.
      why: >
        Deliberately not exposed.  The evidence supports ONE witnessed train (MLEV-4) serving a
        public preparation time; a general train-design API would be a second sequence DSL with no
        witness and no correctness conditions of its own.
      revisit_trigger: >
        A protocol needs a count the initial mode cannot reach, or a second permissive witness
        implements a different count for a stated physical reason.
    - what: The B1-robust G1/G2 variant.
      why: >
        Its rephasing lobe belongs to the READOUT, so its correctness condition spans two modules
        and it is not a leaf mode.  Handbook pp. 893-894, Figure 17.36.
      revisit_trigger: >
        A kernel is proposed that owns preparation-to-readout gradient coupling.  Cross-referenced
        to C3, which is about exactly that class of requirement.
    - what: MRF-specific scheduling policy.
      why: >
        OpenMRF's parameterisation serves a fingerprint schedule, which is a consumer-level goal-
        preparation and flip schedules feeding a dictionary inference.  Caller policy.
      revisit_trigger: A fingerprinting candidate is scanned in its own right.
    - what: >
        Whether the three-axis crusher derating policy belongs here or in `spoiler`.
      why: >
        Both OpenMRF preparations derate each crusher axis to 1/sqrt(3) of the nominal gradient
        and slew limit and stagger the three ramps, citing nerve stimulation.  SeqCraft's spoiler
        is one axis at a time with no such policy.
      revisit_trigger: >
        The Phase A SpiralReadout dephaser item is taken up -- the same question, and this corpus
        has a deliberate answer to it.

skill_observation:
  do_not_change_v0_yet: true
  observation: >
    Mature MRI physical abstractions may be established by authoritative domain evidence even when
    executable implementation witnesses are sparse.  Code witnesses constrain
    implementation-specific claims; they do not determine the existence of the physical
    abstraction.
  what_v0_lacks: >
    An `evidence_class` distinction.  v0's `evidence[].role` vocabulary is about a reference's
    relationship to OTHER references -- primary, authoritative-external, independent-formulation,
    independent-implementation, supporting, architecture-evidence -- and every value presumes the
    reference is an implementation.  A handbook is none of them, and `authoritative-external` is
    the closest fit while meaning something else.  This record carries a hand-added
    `evidence_class: domain-reference` and a `curated_card` pointer.
  what_it_changed_here: >
    The first pass of this scan reached YELLOW because it read one implementation witness as
    thin evidence for the family.  With the domain reference as a separate class, the same
    evidence supports APPROVED_FOR_IMPLEMENTATION -- and the implementation witnesses do the job
    they are actually good for, which is fixing the mode and the timing convention.
  phase_e_question: >
    Whether the same distinction earns its place in C2 (bSSFP) and C3 (flow/moment encoding)
    before it is formalised.  Do not formalise on one case.
