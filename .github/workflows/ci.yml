name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per pull request.  A review push supersedes the commit before it, and this run asks
# for six hosted runners, so without this a burst of review commits keeps several obsolete
# commits occupying the pool while the one under review waits behind them.
#
# Keyed on the pull request NUMBER rather than on the branch name: a branch name is unique only
# within a repository, so two forks can both open a PR from `fix/thing` and would otherwise share
# a group and cancel each other.  A PR number is unique in this repository whatever the source.
#
# `github.event.pull_request.number` exists only on `pull_request` events, so a push to `main`
# falls through to `github.run_id`, which is unique per run.  Main runs therefore group alone and
# cancel nothing: a merge is a distinct commit whose result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Vendor .asc gradient descriptors are never available in CI by design, so the `hardware`
# marker is always deselected here.  Build notebooks run in a separate smoke job; simulation,
# reconstruction and site-data tiers stay on the lab/nightly runner.  See docs/testing.md.
#
# Two kinds of job, and the split is the point:
#
#   checks       what we deliberately validate ONCE, on the primary environment: coverage, the
#                doctests, the API reference and the prose attribution.  This is a de-duplication
#                policy, not a claim that those checks are incapable of platform-dependent
#                behaviour -- the doctests and the API-reference blocks are executable code.  The
#                package's OS and Python compatibility stays covered by the pytest lanes below.
#   test         the compatibility matrix.  Does the suite pass on this OS and this Python?
#                It runs pytest only; the once-only checks above are not repeated here, and a
#                new lane does not acquire them merely by being new.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints.txt
      - run: python -m pip install --constraint ci/constraints.txt ruff
      - run: ruff check .

  # `[tool.mypy]` sets `python_version = '3.10'`, which keeps mypy's target-language semantics at
  # the declared minimum -- the version that can actually lack a newer stdlib name.  Moving the
  # host interpreter does not change that intended target.  It is still the host, though, so it
  # supplies the installed stubs mypy reads; this job was re-run on 3.14 before the move.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints.txt
      - run: python -m pip install --constraint ci/constraints.txt -e ".[dev]"
      # The same set as pyproject.toml's strict overrides and docs/testing.md.
      - name: strict pure-core types
        run: >-
          mypy
          src/seqcraft/design/timing.py
          src/seqcraft/design/units.py
          src/seqcraft/design/module.py
          src/seqcraft/scanner/opts.py
          src/seqcraft/compiler/model.py
          src/seqcraft/compiler/placement.py
          src/seqcraft/compiler/boundaries.py
          src/seqcraft/compiler/legalization.py
          src/seqcraft/compiler/emission.py

  # The primary environment: Ubuntu on the current primary Python.  It carries the once-only
  # validations plus its own suite run, and it is the baseline both `test` lanes are compared
  # against -- each of them changes one primary compatibility dimension away from this job.
  #
  # The once-only validations used to be appended to every matrix lane, which spent four runners
  # computing the same four answers -- and the coverage one is not cheap: instrumentation costs
  # 64-80% on this suite.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints.txt
      - run: python -m pip install --constraint ci/constraints.txt -e ".[dev,viz,rf]"
      - name: test suite with coverage
        run: >-
          pytest -n auto
          -m "not slow and not bloch and not crossval and not hardware"
          --cov=seqcraft --cov-report=term-missing
          --durations=20
      - name: doctests
        run: pytest --doctest-modules src/seqcraft
      # Executes every python block in docs/api_reference.md and checks its index against every
      # module's __all__ in both directions.  A reference nobody runs is wrong within two commits.
      - name: api reference
        run: python tools/check_api_reference.py
      # Blocks a short list of specific unsupported attributions; the broad review words it also
      # tracks are printed by `--review` and never fail.  See docs/writing_a_module.md.
      - name: prose attribution
        run: python tools/check_prose_attribution.py

  # Does the suite pass on this OS and this Python?  The primary lane is covered by `checks`
  # above, so it is excluded here rather than run twice.
  test:
    strategy:
      # A compatibility lane that has already failed has answered the question the matrix exists
      # to ask, and the remaining lanes are then paying for an answer nobody is waiting for.
      fail-fast: true
      # Listed as explicit combinations rather than as a cross product with exclusions: the
      # coverage we want is not Cartesian, so writing it as a product we then cut down states it
      # less clearly than naming the two lanes.  The third suite environment is `checks`.
      #
      # Each lane changes one primary compatibility dimension relative to the primary environment
      # (ubuntu 3.14), which makes a failure easier to localise:
      #
      #   ubuntu  3.10   the Python-3.10 environment.  The minimum `requires-python` in
      #                  pyproject.toml, so it is the version whose support we assert publicly and
      #                  must therefore actually run.  Note that it is a whole environment and not
      #                  only an interpreter: 3.10 also resolves older NumPy and matplotlib, so a
      #                  failure here is not by itself proof that the interpreter caused it.
      #                  NumPy is pinned separately for it; see ci/constraints.txt.
      #   windows 3.14   OS varies, Python held at the primary version.
      #
      # Windows 3.11 was dropped deliberately.  Once the minimum-Python Linux lane and the
      # primary-Python Windows lane are both present, it adds relatively little independent
      # compatibility information for the cost of another full-suite execution -- a judgement
      # about marginal value, not a claim that it could detect nothing.
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints.txt
      - run: python -m pip install --constraint ci/constraints.txt -e ".[dev,viz,rf]"
      - name: test suite
        run: >-
          pytest -n auto
          -m "not slow and not bloch and not crossval and not hardware"
          --durations=20

  # Layer 2: does each example notebook still execute end to end?  The set is the explicit
  # `_NOTEBOOKS` allowlist in tools/run_notebook_smoke.py -- build-only notebooks, which is not
  # the same as "every 01_build": four `03` notebooks need nothing but seqcraft and matplotlib
  # and are in it, and the simulation tier is what is excluded.  The allowlist is the source of
  # truth; do not re-derive it from a filename pattern.
  #
  # The runner executes four at a time, so this job's cost is no longer one kernel start after
  # another.  The semantic assertions about these notebooks live in the pytest suite (Layer 1)
  # and are not repeated here: this job answers "does it run", not "is it right".
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints.txt
      - run: python -m pip install --constraint ci/constraints.txt -e ".[dev,viz,rf]"
      - name: build notebook smoke tests
        run: python tools/run_notebook_smoke.py
