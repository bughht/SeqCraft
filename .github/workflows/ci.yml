name: ci

on:
  push:
    branches: [main]
  pull_request:

# Vendor .asc gradient descriptors are never available in CI by design, so the `hardware`
# marker is always deselected here.  PNS runs against the synthetic model instead.  The
# golden/bloch/crossval tiers likewise need local data or MATLAB and run nightly on the lab
# machine -- see docs/testing.md.  Green CI does not mean the full suite ran.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: mypy src/seqcraft

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,viz]"
      - name: test suite
        run: >-
          pytest -n auto
          -m "not slow and not bloch and not crossval and not hardware"
          --cov=seqcraft --cov-report=term-missing
      - name: doctests
        run: pytest --doctest-modules src/seqcraft
      - name: README snippet
        run: pytest --doctest-glob='*.md' README.md
      - name: example runs
        run: python examples/01_gre_2d.py
