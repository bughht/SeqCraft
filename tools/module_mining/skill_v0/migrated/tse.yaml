  - repo: pulseq/pulseq               # [VERBATIM]
    path: matlab/demoSeq/writeHASTE.m
    role: deferred
    executable: documentary
    license: null                     # [NOT RECORDED] the historical record left this blank;
                                      # not filled in here, since the repo-level MIT signal is a
                                      # repository fact and this field is a file-level one
    # deferred before any comparison was attempted
    independence: >                   # [NOT RECORDED] never assessed -- the reference was
      Not assessed.  Deferred before use; open_question "Is HASTE fully expressible as
      configuration, against writeHASTE.m?" is still open.

contract:                             # [VERBATIM] historical key was `physics`
  intrinsic: >                        # [RECONSTRUCTED] findings.md section 8, invariant_table.md
    Within one shot: the crusher window that satisfies three axes at once, the echo spacing that
    window implies, and the placement that puts every echo at the midpoint between its two
    refocusing centres.  None of these is determinable by any single leaf.
  invariants:                         # [VERBATIM]
    - equal gradient area either side of every refocusing effective centre (CPMG conjugation)
    - kx = 0 and ky = requested line at the echo sample
    - refocusing centres uniformly spaced within a shot
    - every echo at the midpoint between its two refocusing centres
    - first interval = half the echo spacing, from the excitation's effective centre
    - crusher balance about the RF effective centre, not the plateau midpoint
    - effective TE is set by the echo carrying the centre line
    - z quiet while any ADC is open
  varying_parameters:                 # [VERBATIM]
    - echoes
    - echo_spacing_s
    - matrix / fov
    - partial_fourier
    - refocus flip and duration
    - crusher cycles on slice and readout axes
  modes: []                           # [RECONSTRUCTED] no mode set: echoes and partial_fourier
                                      # are continuous parameters, not named physical modes.
                                      # Rule A does not fire.
  excluded_caller_policy:             # [VERBATIM] historical `physics.caller_policy`
    - the phase-encode table (segments)
    - 'ordering: linear / interleaved / centric'
    - dummy shot count
    - slice ordering
    - TR
  excluded_pulseq_artifacts:          # [RECONSTRUCTED] comparison_report.md line 120 records
                                      # 185 vs 350 blocks and marks it "diagnostic only"
    - block count -- 185 against 350 for identical physics, explicitly not an equivalence
      criterion
    - nesting shape -- the package nests a kernel where the notebook nests a method
    - label usage -- none (R2) / autoLabel after the fact (R3) / LIN+SEG during build (R1)

acceptance:                           # [RECONSTRUCTED] boundary_decision.md section 3.
                                      # The historical record had no `acceptance` block; the
                                      # criterion lived in the playbook and in prose.
  claim: >
    The extraction preserves the notebook's behaviour event for event: absolute times and content
    hashes of every leaf event agree, with nesting and tags ignored.
  criterion: event-identity
  tolerance: exact -- absolute times and content hashes, at four turbo factors
  defined_before_extraction: true     # [RECONSTRUCTED] the playbook fixed event identity as the
                                      # promotion criterion before this pilot began; see
                                      # fine_scan_playbook.md section 11
  establishes:
    - the extracted TSEShot and FSE2D emit exactly the notebook's events at echoes 1, 8, 16 and
      at a 72-echo HASTE with partial_fourier 0.625
    - the fine-scan sweep re-run against the extracted modules gives numbers identical to the
      notebook's, 8/8 cases
    - both Python implementations satisfy every TSE invariant (comparator L4)
  does_not_establish:
    - that either implementation matches the MATLAB reference -- writeTSE.m was never run and no
      .seq was produced (comparison_report.md section 5)
    - that the two Python references agree on event structure; they do not, at 185 against 350
      blocks, and the comparison deliberately does not judge that
    - that the ky tables agree -- a table difference is reported and not judged
    - that the dummy-shot difference D3 is resolved; it is recorded and unmeasured
    - anything about variable-flip TSE, which is out of scope

validation:
  generic_measurements:               # [VERBATIM] validation.levels_run
    - L0 duration, ADC, RF, excitation and refocusing counts
    - L2 waveform areas on exact knots
    - 'L3 acquisition semantics: TE and k at the echo'
  family_checks:
    - L4 every TSE invariant, on both implementations
  metamorphic: >                      # [VERBATIM] validation.metamorphic
    3/3 pass, 1 cited from CI -- M1 is pinned by tests/modules/test_se_notebooks.py
  parameter_sweep: 8/8 cases pass     # [VERBATIM] validation.parameter_sweep
  emitted_inspection: []              # [NOT RECORDED] rule B did not exist during this pilot.
                                      # contract.modes is empty so the rule does not fire, and
                                      # nothing is back-filled here.
  layers:                             # [RECONSTRUCTED] the ladder was defined after this pilot;
                                      # these are the layers the recorded evidence actually covers
    layer_1: GREEN                    # comparator L0/L2/L3/L4 + sweep + metamorphic
    layer_2: GREEN                    # examples/fse_2d/01 and 03 both build and execute in CI
    layer_3: GREEN                    # examples/fse_2d/02 simulates and reconstructs
    layer_3_reason: >
      Not deferred.  fse_2d/02 measures the echo envelope, point-spread width per ordering and
      the ghost a scattered table makes, and closes with one representative image built from the
      package path.
  extraction:                         # [VERBATIM]
    event_digest_vs_notebook: identical at echoes 1, 8, 16 and 72 (HASTE)
    sweep_vs_notebook: 8/8, numbers identical
  package_suite: 902 passed / 19 skipped (was 857)   # [VERBATIM]
  compiler_changes: none              # [VERBATIM]
  comparator_corrections:             # [VERBATIM]
    - the echo is the interpolated kx zero crossing, not the nearest sample
    - the equal-area rule about a refocusing pulse does not apply to the phase axis

dependency_impact:
  # [RECONSTRUCTED] Rule D did not exist during this pilot and no map was made.  Consumers below
  # are found by searching for CONSTRUCTION of CartesianLine in the tree as it stands on this
  # branch, not for the class name: epi_2d.py, excitation.py, refocusing.py and _support.py
  # mention it only in docstrings.
  #
  # NOTE ON SCOPE: this is the blast radius of the echo-geometry ADDITION
  # (area_after_echo_per_m, echo_moment_imbalance_per_m), which added read-only properties and
  # changed no existing behaviour.  That is why every classification below is NO_BEHAVIOR_CHANGE
  # and why the historical pilot got away without the map.
  - consumer: src/seqcraft/modules/kernel/gre_2d_tr.py
    relation: direct
    classification: NO_BEHAVIOR_CHANGE
    note: new read-only properties; no existing call path altered
  - consumer: src/seqcraft/modules/kernel/tse_shot.py
    relation: direct
    classification: INTENTIONAL_BEHAVIOR_CHANGE
    note: the candidate itself, and the reason the properties were added
  - consumer: src/seqcraft/modules/kernel/gre_3d_tr.py
    relation: direct
    classification: NO_BEHAVIOR_CHANGE
    note: >
      Did not exist at the time of this pilot.  Listed because the map is being drawn now, on
      the current tree, and pretending otherwise would misrepresent what it covers.
  - consumer: src/seqcraft/modules/readout/radial_readout.py
    relation: direct
    classification: NO_BEHAVIOR_CHANGE
    note: did not exist at the time of this pilot; see above
  - consumer: src/seqcraft/modules/imaging/gre_2d.py
    relation: transitive via GRE2DTR
    classification: NO_BEHAVIOR_CHANGE
  - consumer: src/seqcraft/modules/imaging/fse_2d.py
    relation: transitive via TSEShot
    classification: INTENTIONAL_BEHAVIOR_CHANGE
    note: shipped as part of this candidate
  - consumer: examples/ -- every build notebook composing CartesianLine
    relation: notebooks
    classification: NO_BEHAVIOR_CHANGE
    note: all nine build notebooks executed clean at the time (boundary_decision.md section 3)

